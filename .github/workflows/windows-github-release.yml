          "TRUSTED_HANDOFF_HARNESS=$handoffHarness" >> $env:GITHUB_ENV
          "VERIFICATION_INPUT_INSTALLER=$localInstaller" >> $env:GITHUB_ENV
      - name: Run two lifecycle passes on identical bytes without signing authority
        id: verified
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidencePath = Join-Path $env:CLEAN_VERIFICATION_ROOT 'evidence\lifecycle-evidence.v1.json'
          $expectedInstallDirectory = [IO.Path]::GetFullPath((Join-Path $env:LOCALAPPDATA 'Programs\Survey Data Workbench by LAI ZEYU'))
          $expectedDataDirectory = [IO.Path]::GetFullPath((Join-Path $env:LOCALAPPDATA 'LAI Systems\Survey Data Workbench'))
          $expectedShortcut = [IO.Path]::GetFullPath((Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\Survey Data Workbench by LAI ZEYU.lnk'))
          $expectedUninstallRegistryKey = 'HKCU\Software\Microsoft\Windows\CurrentVersion\Uninstall\{8A95FB16-D832-4FE4-AD7C-CDFED12E4274}_is1'
          $signedInventoryPath = Join-Path $env:CLEAN_VERIFICATION_ROOT 'input\portable-executable-inventory.v1.json'
          & $env:TRUSTED_VERIFICATION_HARNESS `
            verify-signed-installer-lifecycle `
            --installer $env:VERIFICATION_INPUT_INSTALLER `
            --expected-installer-sha256 $env:EXPECTED_INSTALLER_SHA256 `
            --expected-signer-thumbprint $env:EXPECTED_SIGNER_THUMBPRINT `
            --expected-executable-name 'StatFlow.Workbench.Desktop.exe' `
            --expected-sidecar-relative-path 'backend\statflow-backend.exe' `
            --expected-install-directory $expectedInstallDirectory `
            --expected-data-directory $expectedDataDirectory `
            --expected-uninstall-registry-key $expectedUninstallRegistryKey `
            --expected-start-menu-shortcut $expectedShortcut `
            --signed-portable-executable-inventory $signedInventoryPath `
            --passes 2 `
            --forbid-signing-credentials `
            --forbid-preexisting-product-state `
            --forbid-reparse-points `
            --evidence-output $evidencePath
          if ($LASTEXITCODE -ne 0) { throw 'Pinned independent verification harness failed.' }
          if ((Get-FileHash -LiteralPath $env:VERIFICATION_INPUT_INSTALLER -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:EXPECTED_INSTALLER_SHA256) {
            throw 'Lifecycle verification changed the installer bytes.'
          }
          $evidenceFiles = @(Get-ChildItem -LiteralPath (Split-Path -Parent $evidencePath) -File -Force)
          if ($evidenceFiles.Count -ne 1 -or -not (Test-Path -LiteralPath $evidencePath -PathType Leaf)) { throw 'Verification harness evidence inventory differs.' }
          $evidence = Get-Content -LiteralPath $evidencePath -Raw | ConvertFrom-Json
          $evidenceProperties = @('allInstalledPortableExecutablesHaveExactlyOneSignature','allInstalledPortableExecutablesMatchSignedInventory','allInstalledPortableExecutablesRfc3161TimestampVerified','allInstalledPortableExecutablesSigned','allInstalledPortableExecutablesTimestampAuthorityEkuVerified','candidateExecutionPerformedInVerificationDomain','expectedDataDirectory','expectedExecutableName','expectedInstallDirectory','expectedSidecarRelativePath','expectedStartMenuShortcut','expectedUninstallRegistryKey','identicalInstallerBytesUsed','installerName','installerSha256','lifecyclePasses','passes','portableExecutableInventorySha256','schemaVersion','signerThumbprint','signingCredentialPresent','verificationHarnessSha256','verificationKind') | Sort-Object
          if ((Compare-Object $evidenceProperties (@($evidence.PSObject.Properties.Name) | Sort-Object)) -or
              [int]$evidence.schemaVersion -ne 1 -or [string]$evidence.verificationKind -cne 'same-byte-two-pass-installer-lifecycle' -or
              [string]$evidence.installerName -cne $env:EXPECTED_INSTALLER_NAME -or [string]$evidence.installerSha256 -cne $env:EXPECTED_INSTALLER_SHA256 -or
              [string]$evidence.signerThumbprint -cne $env:EXPECTED_SIGNER_THUMBPRINT -or
              [string]$evidence.verificationHarnessSha256 -cne $env:VERIFICATION_HARNESS_SHA256 -or
              [string]$evidence.expectedExecutableName -cne 'StatFlow.Workbench.Desktop.exe' -or
              [string]$evidence.expectedSidecarRelativePath -cne 'backend\statflow-backend.exe' -or
              [IO.Path]::GetFullPath([string]$evidence.expectedInstallDirectory) -cne $expectedInstallDirectory -or
              [IO.Path]::GetFullPath([string]$evidence.expectedDataDirectory) -cne $expectedDataDirectory -or
              [string]$evidence.expectedUninstallRegistryKey -cne $expectedUninstallRegistryKey -or
              [IO.Path]::GetFullPath([string]$evidence.expectedStartMenuShortcut) -cne $expectedShortcut -or
              [string]$evidence.portableExecutableInventorySha256 -cne $env:EXPECTED_PE_INVENTORY_SHA256 -or
              [int]$evidence.lifecyclePasses -ne 2 -or $evidence.identicalInstallerBytesUsed -ne $true -or
              $evidence.candidateExecutionPerformedInVerificationDomain -ne $true -or $evidence.signingCredentialPresent -ne $false -or
              $evidence.allInstalledPortableExecutablesSigned -ne $true -or
              $evidence.allInstalledPortableExecutablesHaveExactlyOneSignature -ne $true -or
              $evidence.allInstalledPortableExecutablesMatchSignedInventory -ne $true -or
              $evidence.allInstalledPortableExecutablesRfc3161TimestampVerified -ne $true -or
              $evidence.allInstalledPortableExecutablesTimestampAuthorityEkuVerified -ne $true -or
              @($evidence.passes).Count -ne 2) { throw 'Independent lifecycle evidence is incomplete or differently bound.' }
          $installedExecutableHash = $null
          $installedSidecarHash = $null
          $installedUninstallerHash = $null
          $installedPeInventoryHash = $null
          for ($index = 0; $index -lt 2; $index++) {
            $pass = @($evidence.passes)[$index]
            $passProperties = @('allInstalledPortableExecutablesHaveExactlyOneSignature','allInstalledPortableExecutablesMatchSignedInventory','allInstalledPortableExecutablesRfc3161TimestampVerified','allInstalledPortableExecutablesSigned','allInstalledPortableExecutablesTimestampAuthorityEkuVerified','dataDirectoryRemoved','desktopProcessCreationTimeUtc','executableRemoved','healthCheckSucceeded','installDirectoryPath','installDirectoryRemoved','installExitCode','installedExecutablePath','installedExecutableSha256','installedPortableExecutableCount','installedPortableExecutableInventorySha256','installedSidecarPath','installedSidecarSha256','installerSha256After','installerSha256Before','launchedExecutablePath','launchedProcessId','listenerAddress','listenerCount','listenerOwnedByExpectedProcess','listenerPort','listenerProcessId','passNumber','preexistingProductStateDetected','processExited','reparsePointDetected','shortcutsRemoved','sidecarParentProcessId','sidecarProcessCreationTimeUtc','sidecarProcessExited','sidecarProcessId','sidecarRemoved','startMenuShortcutPath','uninstallExitCode','uninstallRegistryKey','uninstallRegistryRemoved','uninstallerPath','uninstallerRemoved','uninstallerSha256') | Sort-Object
            $installDirectory = [IO.Path]::GetFullPath([string]$pass.installDirectoryPath)
            $installedPath = [IO.Path]::GetFullPath([string]$pass.installedExecutablePath)
            $installedSidecarPath = [IO.Path]::GetFullPath([string]$pass.installedSidecarPath)
            $launchedPath = [IO.Path]::GetFullPath([string]$pass.launchedExecutablePath)
            $uninstallerPath = [IO.Path]::GetFullPath([string]$pass.uninstallerPath)
            $shortcutPath = [IO.Path]::GetFullPath([string]$pass.startMenuShortcutPath)
            $expectedInstalledPath = [IO.Path]::GetFullPath((Join-Path $expectedInstallDirectory 'StatFlow.Workbench.Desktop.exe'))
            $expectedSidecarPath = [IO.Path]::GetFullPath((Join-Path $expectedInstallDirectory 'backend\statflow-backend.exe'))
            $expectedUninstallerPath = [IO.Path]::GetFullPath((Join-Path $expectedInstallDirectory 'unins000.exe'))
            if ((Compare-Object $passProperties (@($pass.PSObject.Properties.Name) | Sort-Object)) -or
                [int]$pass.passNumber -ne ($index + 1) -or [string]$pass.installerSha256Before -cne $env:EXPECTED_INSTALLER_SHA256 -or
                [string]$pass.installerSha256After -cne $env:EXPECTED_INSTALLER_SHA256 -or [int]$pass.installExitCode -ne 0 -or
                $installDirectory -cne $expectedInstallDirectory -or $installedPath -cne $expectedInstalledPath -or
                $installedSidecarPath -cne $expectedSidecarPath -or $uninstallerPath -cne $expectedUninstallerPath -or
                $shortcutPath -cne $expectedShortcut -or [string]$pass.uninstallRegistryKey -cne $expectedUninstallRegistryKey -or
                $launchedPath -cne $installedPath -or [string]$pass.installedExecutableSha256 -cnotmatch '^[0-9a-f]{64}$' -or
                [string]$pass.installedSidecarSha256 -cnotmatch '^[0-9a-f]{64}$' -or [string]$pass.uninstallerSha256 -cnotmatch '^[0-9a-f]{64}$' -or
                [string]$pass.installedPortableExecutableInventorySha256 -cnotmatch '^[0-9a-f]{64}$' -or [int]$pass.installedPortableExecutableCount -lt 3 -or
                [int]$pass.launchedProcessId -le 0 -or [string]$pass.desktopProcessCreationTimeUtc -cnotmatch '^\d{4}-\d{2}-\d{2}T' -or
                [int]$pass.sidecarProcessId -le 0 -or [int]$pass.sidecarProcessId -eq [int]$pass.launchedProcessId -or
                [int]$pass.sidecarParentProcessId -ne [int]$pass.launchedProcessId -or [string]$pass.sidecarProcessCreationTimeUtc -cnotmatch '^\d{4}-\d{2}-\d{2}T' -or
                [int]$pass.listenerProcessId -ne [int]$pass.sidecarProcessId -or [int]$pass.listenerCount -ne 1 -or
                [string]$pass.listenerAddress -cne '127.0.0.1' -or [int]$pass.listenerPort -lt 1024 -or [int]$pass.listenerPort -gt 65535 -or
                $pass.listenerOwnedByExpectedProcess -ne $true -or $pass.preexistingProductStateDetected -ne $false -or $pass.reparsePointDetected -ne $false -or
                $pass.allInstalledPortableExecutablesSigned -ne $true -or $pass.allInstalledPortableExecutablesHaveExactlyOneSignature -ne $true -or
                $pass.allInstalledPortableExecutablesMatchSignedInventory -ne $true -or
                $pass.allInstalledPortableExecutablesRfc3161TimestampVerified -ne $true -or
                $pass.allInstalledPortableExecutablesTimestampAuthorityEkuVerified -ne $true -or
                $pass.healthCheckSucceeded -ne $true -or [int]$pass.uninstallExitCode -ne 0 -or $pass.processExited -ne $true -or
                $pass.sidecarProcessExited -ne $true -or $pass.executableRemoved -ne $true -or $pass.sidecarRemoved -ne $true -or
                $pass.uninstallerRemoved -ne $true -or $pass.installDirectoryRemoved -ne $true -or $pass.dataDirectoryRemoved -ne $true -or
                $pass.uninstallRegistryRemoved -ne $true -or $pass.shortcutsRemoved -ne $true) {
              throw "Lifecycle pass $($index + 1) is incomplete or names a different executable/process/listener/cleanup state."
            }
            if ($null -eq $installedExecutableHash) { $installedExecutableHash = [string]$pass.installedExecutableSha256 }
            elseif ([string]$pass.installedExecutableSha256 -cne $installedExecutableHash) { throw 'Two lifecycle passes installed different executable bytes.' }
            if ($null -eq $installedSidecarHash) { $installedSidecarHash = [string]$pass.installedSidecarSha256 }
            elseif ([string]$pass.installedSidecarSha256 -cne $installedSidecarHash) { throw 'Two lifecycle passes installed different sidecar bytes.' }
            if ($null -eq $installedUninstallerHash) { $installedUninstallerHash = [string]$pass.uninstallerSha256 }
            elseif ([string]$pass.uninstallerSha256 -cne $installedUninstallerHash) { throw 'Two lifecycle passes installed different uninstaller bytes.' }
            if ($null -eq $installedPeInventoryHash) { $installedPeInventoryHash = [string]$pass.installedPortableExecutableInventorySha256 }
            elseif ([string]$pass.installedPortableExecutableInventorySha256 -cne $installedPeInventoryHash) { throw 'Two lifecycle passes produced different installed PE inventories.' }
          }
          $privateSignerKeys = @(
            Get-ChildItem Cert:\CurrentUser\My -ErrorAction Stop
            Get-ChildItem Cert:\LocalMachine\My -ErrorAction Stop
          ) | Where-Object { $_.Thumbprint -ieq $env:EXPECTED_SIGNER_THUMBPRINT -and $_.HasPrivateKey }
          if (@($privateSignerKeys).Count -ne 0) { throw 'Signing private key appeared in the verifier domain.' }
          $input = Join-Path $env:CLEAN_VERIFICATION_ROOT 'input'
          $installer = Join-Path $input $env:EXPECTED_INSTALLER_NAME
          $hashFile = Join-Path $input 'SHA256SUMS.txt'
          $signingEvidence = Join-Path $input 'signing-evidence.v1.json'
          $inventory = Join-Path $input 'portable-executable-inventory.v1.json'
          $signedRecord = Join-Path $input 'signed.v2.json'
          $verificationEvidenceHash = (Get-FileHash -LiteralPath $evidencePath -Algorithm SHA256).Hash.ToLowerInvariant()
          $root = [IO.Path]::GetFullPath($env:PRIVATE_HANDOFF_ROOT).TrimEnd('\')
          $verifiedHandoffId = "release-verified-$($env:SOURCE_COMMIT)-$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT)"
          $final = Join-Path $root $verifiedHandoffId
          $staging = Join-Path $root ('.staging-' + $verifiedHandoffId + '-' + [Guid]::NewGuid().ToString('N'))
          if (Test-Path -LiteralPath $final) { throw 'Verified private publication handoff already exists.' }
          try {
            New-Item -ItemType Directory -Path $staging | Out-Null
            Copy-Item -LiteralPath $installer,$hashFile,$signingEvidence,$inventory,$evidencePath -Destination $staging
            [ordered]@{
              schemaVersion=3; handoffKind='private-verified-release-publication'; handoffId=$verifiedHandoffId
              repository='${{ github.repository }}'; repositoryId=[long]'${{ github.repository_id }}'; repositoryOwner='${{ github.repository_owner }}'
              sourceCommit=$env:SOURCE_COMMIT; releaseTag='windows-v1.1.0'; applicationVersion='1.1.0'
              workflowRunId='${{ github.run_id }}'; workflowRunAttempt=[int]'${{ github.run_attempt }}'; buildHandoffId=$env:BUILD_HANDOFF_ID
              signedHandoffId=$env:SIGNED_HANDOFF_ID; installerName=$env:EXPECTED_INSTALLER_NAME; installerSha256=$env:EXPECTED_INSTALLER_SHA256
              signerThumbprint=$env:EXPECTED_SIGNER_THUMBPRINT; signingEvidenceSha256=$env:EXPECTED_SIGNING_EVIDENCE_SHA256
              portableExecutableInventorySha256=$env:EXPECTED_PE_INVENTORY_SHA256; signingHarnessSha256=$env:EXPECTED_SIGNING_HARNESS_SHA256
              verificationEvidenceSha256=$verificationEvidenceHash; verificationHarnessSha256=$env:VERIFICATION_HARNESS_SHA256
              handoffHarnessSha256=$env:HANDOFF_HARNESS_SHA256
            } | ConvertTo-Json -Compress | Set-Content -LiteralPath (Join-Path $staging 'publish.v3.json') -Encoding UTF8
            $stagingItems = @(Get-Item -LiteralPath $staging -Force; Get-ChildItem -LiteralPath $staging -Recurse -Force)
            if (@($stagingItems | Where-Object { ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 }).Count -gt 0) { throw 'Verified publication staging contains a reparse point.' }
            & $env:TRUSTED_HANDOFF_HARNESS publish-handoff `
              --staging-path $staging `
              --final-path $final `
              --owner $env:HANDOFF_OWNER_PRINCIPAL `
              --reader $env:EXPECTED_VERIFIER_PRINCIPAL `
              --reader $env:PUBLISHER_PRINCIPAL `
              --cleanup $env:CLEANUP_PRINCIPAL `
              --forbid-writer `
              --forbid-principal $env:SIGNING_PRINCIPAL `
              --forbid-principal $env:BUILD_PRINCIPAL `
              --forbid-principal $env:REVIEW_GATE_PRINCIPAL `
              --forbid-broad `
              --forbid-reparse
            if ($LASTEXITCODE -ne 0) { throw 'Could not atomically publish the frozen verifier-to-publisher handoff.' }
            & $env:TRUSTED_HANDOFF_HARNESS assert-handoff `
              --path $final `
              --owner $env:HANDOFF_OWNER_PRINCIPAL `
              --reader $env:EXPECTED_VERIFIER_PRINCIPAL `
              --reader $env:PUBLISHER_PRINCIPAL `
              --cleanup $env:CLEANUP_PRINCIPAL `
              --forbid-writer `
              --forbid-principal $env:SIGNING_PRINCIPAL `
              --forbid-principal $env:BUILD_PRINCIPAL `
              --forbid-principal $env:REVIEW_GATE_PRINCIPAL `
              --forbid-broad `
              --forbid-reparse
            if ($LASTEXITCODE -ne 0) { throw 'Verifier-to-publisher handoff retained a previous writer or changed after rename.' }
            if ((Get-FileHash -LiteralPath (Join-Path $final $env:EXPECTED_INSTALLER_NAME) -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:EXPECTED_INSTALLER_SHA256 -or
                (Get-FileHash -LiteralPath (Join-Path $final 'lifecycle-evidence.v1.json') -Algorithm SHA256).Hash.ToLowerInvariant() -cne $verificationEvidenceHash) {
              throw 'Verified installer or lifecycle evidence changed during immutable handoff transfer.'
            }
          } finally {
            if (Test-Path -LiteralPath $staging) {
              if ([IO.Directory]::GetParent([IO.Path]::GetFullPath($staging)).FullName.TrimEnd('\') -cne $root -or
                  (Split-Path -Leaf $staging) -cnotmatch "^\.staging-$([Regex]::Escape($verifiedHandoffId))-[0-9a-f]{32}$") { throw 'Verified-handoff staging cleanup escaped its exact root.' }
              $stagingItems = @(Get-Item -LiteralPath $staging -Force; Get-ChildItem -LiteralPath $staging -Recurse -Force)
              if (@($stagingItems | Where-Object { ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 }).Count -gt 0) { throw 'Verified-handoff staging residue contains a reparse point.' }
              & icacls.exe $staging /inheritance:r /grant:r "$($env:EXPECTED_VERIFIER_PRINCIPAL):(OI)(CI)(F)" /t /c | Out-Null
              if ($LASTEXITCODE -ne 0) { throw 'Could not establish verified-handoff staging cleanup ACL.' }
              Remove-Item -LiteralPath $staging -Recurse -Force
              if (Test-Path -LiteralPath $staging) { throw 'Verified-handoff staging residue remains.' }
            }
          }
          "verified_handoff_id=$verifiedHandoffId" >> $env:GITHUB_OUTPUT
          "installer_name=$($env:EXPECTED_INSTALLER_NAME)" >> $env:GITHUB_OUTPUT
          "installer_sha256=$($env:EXPECTED_INSTALLER_SHA256)" >> $env:GITHUB_OUTPUT
          "signer_thumbprint=$($env:EXPECTED_SIGNER_THUMBPRINT)" >> $env:GITHUB_OUTPUT
          "signing_evidence_sha256=$($env:EXPECTED_SIGNING_EVIDENCE_SHA256)" >> $env:GITHUB_OUTPUT
          "pe_inventory_sha256=$($env:EXPECTED_PE_INVENTORY_SHA256)" >> $env:GITHUB_OUTPUT
          "signing_harness_sha256=$($env:EXPECTED_SIGNING_HARNESS_SHA256)" >> $env:GITHUB_OUTPUT
          "verification_evidence_sha256=$verificationEvidenceHash" >> $env:GITHUB_OUTPUT
          "verification_harness_sha256=$($env:VERIFICATION_HARNESS_SHA256)" >> $env:GITHUB_OUTPUT
      - name: Remove all local verifier inputs and evidence
        if: always()
        shell: pwsh
        run: |
          if ($env:CLEAN_VERIFICATION_ROOT -and (Test-Path -LiteralPath $env:CLEAN_VERIFICATION_ROOT)) {
            $root = [IO.Path]::GetFullPath($env:CLEAN_VERIFICATION_ROOT)
            $runnerTemp = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\')
            if ([IO.Directory]::GetParent($root).FullName.TrimEnd('\') -cne $runnerTemp -or (Split-Path -Leaf $root) -notlike 'statflow-clean-verification-*') { throw 'Verifier cleanup escaped RUNNER_TEMP.' }
            $items = @(Get-Item -LiteralPath $root -Force; Get-ChildItem -LiteralPath $root -Recurse -Force)
            if (@($items | Where-Object { ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 }).Count -gt 0) { throw 'Verifier root contains a reparse point.' }
            & icacls.exe $root /inheritance:e /grant:r "$($env:EXPECTED_VERIFIER_PRINCIPAL):(OI)(CI)(F)" /t /c | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Could not restore verifier cleanup ACL.' }
            Remove-Item -LiteralPath $root -Recurse -Force
            if (Test-Path -LiteralPath $root) { throw 'Local verifier state remains.' }
          }

  publish-release:
    name: No-checkout exact-ID publisher with fail-closed create semantics
    needs: [build-private-release-candidate, verify-signed-release-in-clean-domain]
    if: >-
      needs.verify-signed-release-in-clean-domain.result == 'success' &&
      github.repository_id == '1311362169' &&
      vars.TRUSTED_WINDOWS_REPOSITORY_OWNER != '' &&
      github.repository_owner == vars.TRUSTED_WINDOWS_REPOSITORY_OWNER &&
      github.ref == 'refs/heads/main' && github.ref_protected == true
    environment: trusted-windows-release-publish
    runs-on:
      group: trusted-windows-release-publisher
      labels: [self-hosted, Windows, X64, spss-release-publisher, ephemeral]
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      SOURCE_COMMIT: ${{ needs.build-private-release-candidate.outputs.source_commit }}
      VERIFIED_HANDOFF_ID: ${{ needs.verify-signed-release-in-clean-domain.outputs.verified_handoff_id }}
      EXPECTED_INSTALLER_NAME: ${{ needs.verify-signed-release-in-clean-domain.outputs.installer_name }}
      EXPECTED_INSTALLER_SHA256: ${{ needs.verify-signed-release-in-clean-domain.outputs.installer_sha256 }}
      EXPECTED_SIGNER_THUMBPRINT: ${{ needs.verify-signed-release-in-clean-domain.outputs.signer_thumbprint }}
      EXPECTED_SIGNING_EVIDENCE_SHA256: ${{ needs.verify-signed-release-in-clean-domain.outputs.signing_evidence_sha256 }}
      EXPECTED_PE_INVENTORY_SHA256: ${{ needs.verify-signed-release-in-clean-domain.outputs.pe_inventory_sha256 }}
      EXPECTED_SIGNING_HARNESS_SHA256: ${{ needs.verify-signed-release-in-clean-domain.outputs.signing_harness_sha256 }}
      EXPECTED_VERIFICATION_EVIDENCE_SHA256: ${{ needs.verify-signed-release-in-clean-domain.outputs.verification_evidence_sha256 }}
      EXPECTED_VERIFICATION_HARNESS_SHA256: ${{ needs.verify-signed-release-in-clean-domain.outputs.verification_harness_sha256 }}
      APPROVED_SIGNING_HARNESS_SHA256: ${{ vars.WINDOWS_SIGNING_HARNESS_SHA256 }}
      APPROVED_VERIFICATION_HARNESS_SHA256: ${{ vars.WINDOWS_VERIFICATION_HARNESS_SHA256 }}
      APPROVED_SIGNER_THUMBPRINT: ${{ vars.WINDOWS_SIGNER_THUMBPRINT }}
      PRIVATE_HANDOFF_ROOT: ${{ secrets.RELEASE_PRIVATE_HANDOFF_ROOT }}
      EXPECTED_PUBLISHER_PRINCIPAL: ${{ secrets.RELEASE_PUBLISHER_PRINCIPAL }}
      VERIFIER_PRINCIPAL: ${{ secrets.RELEASE_VERIFIER_PRINCIPAL }}
      SIGNING_PRINCIPAL: ${{ secrets.RELEASE_SIGNING_PRINCIPAL }}
      BUILD_PRINCIPAL: ${{ secrets.RELEASE_BUILD_PRINCIPAL }}
      REVIEW_GATE_PRINCIPAL: ${{ secrets.RELEASE_REVIEW_GATE_PRINCIPAL }}
      CLEANUP_PRINCIPAL: ${{ secrets.RELEASE_CLEANUP_PRINCIPAL }}
      HANDOFF_OWNER_PRINCIPAL: ${{ secrets.RELEASE_HANDOFF_OWNER_PRINCIPAL }}
      HANDOFF_HARNESS_PATH: ${{ vars.WINDOWS_HANDOFF_HARNESS_PATH }}
      HANDOFF_HARNESS_SHA256: ${{ vars.WINDOWS_HANDOFF_HARNESS_SHA256 }}
    steps:
      - name: Verify exact private lifecycle-approved handoff without GitHub write token
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $principalSet = [Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
          foreach ($principal in @($env:EXPECTED_PUBLISHER_PRINCIPAL,$env:VERIFIER_PRINCIPAL,$env:SIGNING_PRINCIPAL,$env:BUILD_PRINCIPAL,$env:REVIEW_GATE_PRINCIPAL,$env:CLEANUP_PRINCIPAL,$env:HANDOFF_OWNER_PRINCIPAL)) {
            if ([string]::IsNullOrWhiteSpace($principal) -or $principal -match '[\r\n]' -or -not $principalSet.Add($principal)) {
              throw 'All release handoff and cleanup principals must be distinct protected identities.'
            }
          }
          if ([Security.Principal.WindowsIdentity]::GetCurrent().Name -cne $env:EXPECTED_PUBLISHER_PRINCIPAL -or
              $env:EXPECTED_SIGNER_THUMBPRINT -cne $env:APPROVED_SIGNER_THUMBPRINT.ToLowerInvariant() -or
              $env:EXPECTED_SIGNING_HARNESS_SHA256 -cne $env:APPROVED_SIGNING_HARNESS_SHA256 -or
              $env:EXPECTED_VERIFICATION_HARNESS_SHA256 -cne $env:APPROVED_VERIFICATION_HARNESS_SHA256 -or
              $env:EXPECTED_SIGNING_HARNESS_SHA256 -cnotmatch '^[0-9a-f]{64}$' -or
              $env:EXPECTED_VERIFICATION_HARNESS_SHA256 -cnotmatch '^[0-9a-f]{64}$' -or
              $env:EXPECTED_VERIFICATION_EVIDENCE_SHA256 -cnotmatch '^[0-9a-f]{64}$' -or
              $env:HANDOFF_HARNESS_SHA256 -cnotmatch '^[0-9a-f]{64}$') { throw 'Publisher principal or protected harness approvals differ.' }
          $handoffHarness = (Resolve-Path -LiteralPath $env:HANDOFF_HARNESS_PATH).Path
          $handoffHarnessItem = Get-Item -LiteralPath $handoffHarness -Force
          $handoffHarnessSignature = Get-AuthenticodeSignature -LiteralPath $handoffHarness
          $handoffHarnessSigner = if ($handoffHarnessSignature.SignerCertificate) { $handoffHarnessSignature.SignerCertificate.GetNameInfo([Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false) } else { '' }
          if ($handoffHarnessItem.PSIsContainer -or ($handoffHarnessItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or
              (Get-FileHash -LiteralPath $handoffHarness -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:HANDOFF_HARNESS_SHA256 -or
              $handoffHarnessSignature.Status -ne 'Valid' -or -not $handoffHarnessSignature.TimeStamperCertificate -or $handoffHarnessSigner -notin @('LAI ZEYU','来泽宇')) {
            throw 'Pinned private-handoff ACL harness is absent, linked, unsigned, or hash-mismatched.'
          }
          $root = [IO.Path]::GetFullPath($env:PRIVATE_HANDOFF_ROOT).TrimEnd('\')
          $rootItem = Get-Item -LiteralPath $root -Force
          if (-not $rootItem.PSIsContainer -or ($rootItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw 'Private publisher handoff root is invalid.' }
          $input = [IO.Path]::GetFullPath((Join-Path $root $env:VERIFIED_HANDOFF_ID))
          if ([IO.Directory]::GetParent($input).FullName.TrimEnd('\') -cne $root) { throw 'Verified handoff escaped private root.' }
          if ($env:VERIFIED_HANDOFF_ID -cne "release-verified-$($env:SOURCE_COMMIT)-${{ github.run_id }}-${{ github.run_attempt }}") { throw 'Verified handoff does not belong to this exact release workflow run.' }
          $items = @(Get-Item -LiteralPath $input -Force; Get-ChildItem -LiteralPath $input -Recurse -Force)
          if (@($items | Where-Object { ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 }).Count -gt 0) { throw 'Verified handoff contains a reparse point.' }
          & $handoffHarness assert-handoff `
            --path $input `
            --owner $env:HANDOFF_OWNER_PRINCIPAL `
            --reader $env:VERIFIER_PRINCIPAL `
            --reader $env:EXPECTED_PUBLISHER_PRINCIPAL `
            --cleanup $env:CLEANUP_PRINCIPAL `
            --forbid-writer `
            --forbid-principal $env:SIGNING_PRINCIPAL `
            --forbid-principal $env:BUILD_PRINCIPAL `
            --forbid-principal $env:REVIEW_GATE_PRINCIPAL `
            --forbid-broad `
            --forbid-reparse
          if ($LASTEXITCODE -ne 0) { throw 'Verifier-to-publisher handoff retained a writer or has a different owner/ACL.' }
          $record = Get-Content -LiteralPath (Join-Path $input 'publish.v3.json') -Raw | ConvertFrom-Json
          $installer = Join-Path $input $env:EXPECTED_INSTALLER_NAME
          $hashFile = Join-Path $input 'SHA256SUMS.txt'
          $evidence = Join-Path $input 'signing-evidence.v1.json'
          $inventory = Join-Path $input 'portable-executable-inventory.v1.json'
          $lifecycleEvidence = Join-Path $input 'lifecycle-evidence.v1.json'
          $publishRecordProperties = @('applicationVersion','buildHandoffId','handoffHarnessSha256','handoffId','handoffKind','installerName','installerSha256','portableExecutableInventorySha256','releaseTag','repository','repositoryId','repositoryOwner','schemaVersion','signedHandoffId','signerThumbprint','signingEvidenceSha256','signingHarnessSha256','sourceCommit','verificationEvidenceSha256','verificationHarnessSha256','workflowRunAttempt','workflowRunId') | Sort-Object
          if (@(Get-ChildItem -LiteralPath $input -File).Count -ne 6 -or
              (Compare-Object $publishRecordProperties (@($record.PSObject.Properties.Name) | Sort-Object)) -or [int]$record.schemaVersion -ne 3 -or
              [string]$record.handoffKind -cne 'private-verified-release-publication' -or [string]$record.handoffId -cne $env:VERIFIED_HANDOFF_ID -or
              [string]$record.repositoryId -cne '1311362169' -or [string]$record.repository -cne '${{ github.repository }}' -or
              [string]$record.repositoryOwner -cne '${{ github.repository_owner }}' -or [string]$record.sourceCommit -cne $env:SOURCE_COMMIT -or
              [string]$record.workflowRunId -cne '${{ github.run_id }}' -or [int]$record.workflowRunAttempt -ne [int]'${{ github.run_attempt }}' -or
              [string]$record.buildHandoffId -cne '${{ needs.build-private-release-candidate.outputs.handoff_id }}' -or [string]$record.applicationVersion -cne '1.1.0' -or
              [string]$record.signedHandoffId -cne "release-signed-$($env:SOURCE_COMMIT)-${{ github.run_id }}-${{ github.run_attempt }}" -or
              [string]$record.releaseTag -cne $env:RELEASE_TAG -or [string]$record.installerName -cne $env:EXPECTED_INSTALLER_NAME -or
              [string]$record.installerSha256 -cne $env:EXPECTED_INSTALLER_SHA256 -or [string]$record.signerThumbprint -cne $env:EXPECTED_SIGNER_THUMBPRINT -or
              [string]$record.signingHarnessSha256 -cne $env:EXPECTED_SIGNING_HARNESS_SHA256 -or
              [string]$record.handoffHarnessSha256 -cne $env:HANDOFF_HARNESS_SHA256 -or
              [string]$record.verificationHarnessSha256 -cne $env:EXPECTED_VERIFICATION_HARNESS_SHA256 -or
              [string]$record.verificationEvidenceSha256 -cne $env:EXPECTED_VERIFICATION_EVIDENCE_SHA256 -or
              (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:EXPECTED_INSTALLER_SHA256 -or
              (Get-Content -LiteralPath $hashFile -Raw).Trim() -cne "$($env:EXPECTED_INSTALLER_SHA256)  $($env:EXPECTED_INSTALLER_NAME)" -or
              [string]$record.signingEvidenceSha256 -cne $env:EXPECTED_SIGNING_EVIDENCE_SHA256 -or
              [string]$record.portableExecutableInventorySha256 -cne $env:EXPECTED_PE_INVENTORY_SHA256 -or
              (Get-FileHash -LiteralPath $evidence -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:EXPECTED_SIGNING_EVIDENCE_SHA256 -or
              (Get-FileHash -LiteralPath $inventory -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:EXPECTED_PE_INVENTORY_SHA256 -or
              (Get-FileHash -LiteralPath $lifecycleEvidence -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:EXPECTED_VERIFICATION_EVIDENCE_SHA256) { throw 'Verified publication handoff differs from exact lifecycle-tested bytes.' }
          $lifecycle = Get-Content -LiteralPath $lifecycleEvidence -Raw | ConvertFrom-Json
          if ([int]$lifecycle.schemaVersion -ne 1 -or [string]$lifecycle.verificationKind -cne 'same-byte-two-pass-installer-lifecycle' -or
              [string]$lifecycle.installerSha256 -cne $env:EXPECTED_INSTALLER_SHA256 -or [int]$lifecycle.lifecyclePasses -ne 2 -or
              $lifecycle.identicalInstallerBytesUsed -ne $true -or $lifecycle.candidateExecutionPerformedInVerificationDomain -ne $true -or
              $lifecycle.signingCredentialPresent -ne $false -or @($lifecycle.passes).Count -ne 2) { throw 'Private lifecycle evidence does not prove the approved independent two-pass gate.' }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          $simpleName = $signature.SignerCertificate.GetNameInfo([Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false)
          if ($signature.Status -ne 'Valid' -or -not $signature.TimeStamperCertificate -or
              $signature.SignerCertificate.Thumbprint.ToLowerInvariant() -cne $env:EXPECTED_SIGNER_THUMBPRINT -or $simpleName -notin @('LAI ZEYU','来泽宇')) { throw 'Publisher input lacks exact LAI signature.' }
          $localRoot = Join-Path $env:RUNNER_TEMP "statflow-release-publisher-${{ github.run_id }}-${{ github.run_attempt }}"
          if ([IO.Directory]::GetParent([IO.Path]::GetFullPath($localRoot)).FullName.TrimEnd('\') -cne [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\') -or
              (Test-Path -LiteralPath $localRoot)) { throw 'Publisher local root is not one fresh direct RUNNER_TEMP child.' }
          "PUBLISH_LOCAL_ROOT=$localRoot" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Path $localRoot | Out-Null
          Copy-Item -LiteralPath $installer,$hashFile,$evidence,$inventory,$lifecycleEvidence,(Join-Path $input 'publish.v3.json') -Destination $localRoot
          $localInstaller = Join-Path $localRoot $env:EXPECTED_INSTALLER_NAME
          if ((Get-FileHash -LiteralPath $localInstaller -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:EXPECTED_INSTALLER_SHA256 -or
              (Get-Content -LiteralPath (Join-Path $localRoot 'SHA256SUMS.txt') -Raw).Trim() -cne "$($env:EXPECTED_INSTALLER_SHA256)  $($env:EXPECTED_INSTALLER_NAME)" -or
              (Get-FileHash -LiteralPath (Join-Path $localRoot 'signing-evidence.v1.json') -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:EXPECTED_SIGNING_EVIDENCE_SHA256 -or
              (Get-FileHash -LiteralPath (Join-Path $localRoot 'portable-executable-inventory.v1.json') -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:EXPECTED_PE_INVENTORY_SHA256 -or
              (Get-FileHash -LiteralPath (Join-Path $localRoot 'lifecycle-evidence.v1.json') -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:EXPECTED_VERIFICATION_EVIDENCE_SHA256) { throw 'Local publisher copy differs from exact verifier outputs.' }
          $localSignature = Get-AuthenticodeSignature -LiteralPath $localInstaller
          if ($localSignature.Status -ne 'Valid' -or -not $localSignature.TimeStamperCertificate -or
              $localSignature.SignerCertificate.Thumbprint.ToLowerInvariant() -cne $env:EXPECTED_SIGNER_THUMBPRINT) { throw 'Local publisher copy lost its exact trusted signature.' }
          & icacls.exe $localRoot /inheritance:r /grant:r "$($env:EXPECTED_PUBLISHER_PRINCIPAL):(OI)(CI)(RX)" /t /c | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Could not freeze local publisher inputs.' }
          "PUBLISH_INPUT_ROOT=$localRoot" >> $env:GITHUB_ENV
      - name: Create, upload, publish, verify, and rollback only by returned numeric ID
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) { throw 'Publisher token is absent.' }
          $installer = Join-Path $env:PUBLISH_INPUT_ROOT $env:EXPECTED_INSTALLER_NAME
          $hashFile = Join-Path $env:PUBLISH_INPUT_ROOT 'SHA256SUMS.txt'
          $title = 'Survey Data Workbench by LAI ZEYU 1.1.0 for Windows'
          $body = 'Created and authored by LAI ZEYU（来泽宇）. A pinned sign-only domain verified every nested PE, signed uninstaller, and installer with one exact RFC 3161 timestamped LAI ZEYU/来泽宇 certificate without launching repository-derived binaries. A separate account with no signing credential then ran two complete install/launch/PID-listener/uninstall-cleanup lifecycle passes on identical installer bytes. The two licensed-SPSS records are reviewer-approved private assertions protected by one shared HMAC; they are not independent cryptographic attestations and do not claim that this signed installer ran in those environments.'
          $headers = @{ Accept='application/vnd.github+json'; Authorization="Bearer $env:GH_TOKEN"; 'X-GitHub-Api-Version'='2022-11-28'; 'User-Agent'='statflow-exact-id-publisher' }
          $apiBase = "https://api.github.com/repos/$env:GITHUB_REPOSITORY"
          function Request([string]$Method,[string]$Uri,[int[]]$Status,[object]$Body=$null) {
            $p = @{ Method=$Method; Uri=$Uri; Headers=$headers; SkipHttpErrorCheck=$true; TimeoutSec=180 }
            if ($null -ne $Body) { $p.ContentType='application/json'; $p.Body=$Body | ConvertTo-Json -Depth 8 -Compress }
            $response = Invoke-WebRequest @p
            if ([int]$response.StatusCode -notin $Status) { throw "GitHub REST $Method returned HTTP $([int]$response.StatusCode)." }
            if ([string]::IsNullOrWhiteSpace([string]$response.Content)) { return $null }
            try { return ([string]$response.Content | ConvertFrom-Json) } catch { throw "GitHub REST $Method returned malformed JSON." }
          }
          function Assert-RepositoryAndRefs {
            $repo = Request GET $apiBase @(200)
            if ([string]$repo.id -cne '1311362169' -or [string]$repo.owner.login -cne '${{ github.repository_owner }}' -or [string]$repo.default_branch -cne 'main') { throw 'Repository identity changed.' }
            $main = Request GET "$apiBase/git/ref/heads/main" @(200)
            $tag = Request GET "$apiBase/git/ref/tags/$([Uri]::EscapeDataString($env:RELEASE_TAG))" @(200)
            $tagObject = $tag.object
            $tagCommit = $null
            $visitedTagObjects = [Collections.Generic.HashSet[string]]::new([StringComparer]::Ordinal)
            for ($depth = 0; $depth -lt 5; $depth++) {
              $objectType = [string]$tagObject.type
              $objectSha = [string]$tagObject.sha
              if ($objectSha -cnotmatch '^[0-9a-f]{40}$') { throw 'Tag object SHA is malformed.' }
              if ($objectType -ceq 'commit') { $tagCommit = $objectSha; break }
              if ($objectType -cne 'tag' -or -not $visitedTagObjects.Add($objectSha)) { throw 'Tag object is unsupported or cyclic.' }
              $annotatedTag = Request GET "$apiBase/git/tags/$objectSha" @(200)
              $tagObject = $annotatedTag.object
            }
            if ([string]::IsNullOrWhiteSpace($tagCommit) -or [string]$main.object.sha -cne $env:SOURCE_COMMIT -or $tagCommit -cne $env:SOURCE_COMMIT) { throw 'Tag and exact current main differ from selected commit.' }
          }
          function Assert-Owned([object]$Release,[long]$Id,[bool]$Draft) {
            if ($Id -le 0 -or [long]$Release.id -ne $Id -or [string]$Release.url -cne "$apiBase/releases/$Id" -or
                [string]$Release.tag_name -cne $env:RELEASE_TAG -or [string]$Release.name -cne $title -or [string]$Release.body -cne $body -or
                [string]$Release.target_commitish -cne $env:SOURCE_COMMIT -or
                $Release.draft -ne $Draft -or $Release.prerelease -ne $false -or [string]$Release.author.login -cne 'github-actions[bot]') { throw 'Release does not match exact returned-ID ownership.' }
          }
          Assert-RepositoryAndRefs
          $existing = Invoke-WebRequest -Uri "$apiBase/releases/tags/$env:RELEASE_TAG" -Headers $headers -SkipHttpErrorCheck -TimeoutSec 120
          if ([int]$existing.StatusCode -ne 404) { throw 'Release tag is no longer unused.' }
          [long]$ownedId = 0
          $expectedAssets = @{}
          try {
            # A timeout, transport error, non-201, or malformed body leaves
            # ownedId at zero. No lookup/adoption is attempted and no remote
            # release is edited after an ambiguous create.
            $created = Request POST "$apiBase/releases" @(201) @{ tag_name=$env:RELEASE_TAG; target_commitish=$env:SOURCE_COMMIT; name=$title; body=$body; draft=$true; prerelease=$false; generate_release_notes=$false }
            $candidateId = [long]$created.id
            Assert-Owned $created $candidateId $true
            $ownedId = $candidateId
            foreach ($file in @($installer,$hashFile)) {
              $item = Get-Item -LiteralPath $file
              $response = Invoke-WebRequest -Uri "https://uploads.github.com/repos/$env:GITHUB_REPOSITORY/releases/$ownedId/assets?name=$([Uri]::EscapeDataString($item.Name))" -Method Post -Headers $headers -ContentType 'application/octet-stream' -InFile $item.FullName -SkipHttpErrorCheck -TimeoutSec 300
              if ([int]$response.StatusCode -ne 201) { throw 'Exact-ID asset upload failed.' }
              $asset = [string]$response.Content | ConvertFrom-Json
              $expectedDigest = 'sha256:' + (Get-FileHash -LiteralPath $item.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              if ([long]$asset.id -le 0 -or [string]$asset.name -cne $item.Name -or [string]$asset.state -cne 'uploaded' -or [string]$asset.digest -cne $expectedDigest -or [long]$asset.size -ne $item.Length) { throw 'Exact-ID asset response differs.' }
              $expectedAssets[$item.Name] = [pscustomobject]@{ id=[long]$asset.id; digest=$expectedDigest; size=[long]$item.Length }
            }
            $draft = Request GET "$apiBase/releases/$ownedId" @(200)
            Assert-Owned $draft $ownedId $true
            if (@($draft.assets).Count -ne 2) { throw 'Draft asset inventory is not exact.' }
            Assert-RepositoryAndRefs
            $published = Request PATCH "$apiBase/releases/$ownedId" @(200) @{ draft=$false }
            Assert-Owned $published $ownedId $false
            $published = Request GET "$apiBase/releases/$ownedId" @(200)
            Assert-Owned $published $ownedId $false
            if (@($published.assets).Count -ne 2) { throw 'Public asset count differs.' }
            foreach ($asset in @($published.assets)) {
              $assetName = [string]$asset.name
              if (-not $expectedAssets.ContainsKey($assetName)) { throw 'Public asset names differ.' }
              $expected = $expectedAssets[$assetName]
              if ([long]$asset.id -ne $expected.id -or [string]$asset.state -cne 'uploaded' -or
                  [string]$asset.digest -cne $expected.digest -or [long]$asset.size -ne $expected.size) { throw 'Public asset identity differs from exact upload response.' }
            }
            $downloadRoot = Join-Path $env:RUNNER_TEMP ("statflow-release-redownload-$ownedId")
            $runnerTemp = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\')
            if ([IO.Directory]::GetParent([IO.Path]::GetFullPath($downloadRoot)).FullName.TrimEnd('\') -cne $runnerTemp -or
                (Test-Path -LiteralPath $downloadRoot)) { throw 'Release redownload root is not one fresh direct RUNNER_TEMP child.' }
            New-Item -ItemType Directory -Path $downloadRoot | Out-Null
            "PUBLISH_REDOWNLOAD_ROOT=$downloadRoot" >> $env:GITHUB_ENV
            $downloadHeaders = $headers.Clone(); $downloadHeaders.Accept='application/octet-stream'
            foreach ($asset in @($published.assets)) {
              $response = Invoke-WebRequest -Uri ([string]$asset.url) -Headers $downloadHeaders -OutFile (Join-Path $downloadRoot ([string]$asset.name)) -PassThru -SkipHttpErrorCheck -TimeoutSec 300
              if ([int]$response.StatusCode -ne 200) { throw 'Published exact-ID asset redownload failed.' }
            }
            if ((Get-FileHash (Join-Path $downloadRoot $env:EXPECTED_INSTALLER_NAME) -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:EXPECTED_INSTALLER_SHA256 -or
                (Get-Content (Join-Path $downloadRoot 'SHA256SUMS.txt') -Raw).Trim() -cne "$($env:EXPECTED_INSTALLER_SHA256)  $($env:EXPECTED_INSTALLER_NAME)") { throw 'Published bytes differ after redownload.' }
            $finalRelease = Request GET "$apiBase/releases/$ownedId" @(200)
            Assert-Owned $finalRelease $ownedId $false
            if (@($finalRelease.assets).Count -ne 2) { throw 'Final public asset count differs.' }
            foreach ($asset in @($finalRelease.assets)) {
              $assetName = [string]$asset.name
              if (-not $expectedAssets.ContainsKey($assetName)) { throw 'Final public asset names differ.' }
              $expected = $expectedAssets[$assetName]
              if ([long]$asset.id -ne $expected.id -or [string]$asset.state -cne 'uploaded' -or
                  [string]$asset.digest -cne $expected.digest -or [long]$asset.size -ne $expected.size) { throw 'Final public asset identity changed.' }
            }
            Assert-RepositoryAndRefs
          } catch {
            $failure = $_.Exception.Message
            if ($ownedId -gt 0) {
              try {
                $current = Request GET "$apiBase/releases/$ownedId" @(200)
                Assert-Owned $current $ownedId ([bool]$current.draft)
                if ($current.draft -ne $true) {
                  $rolled = Request PATCH "$apiBase/releases/$ownedId" @(200) @{ draft=$true }
                  Assert-Owned $rolled $ownedId $true
                }
              } catch { throw "Publication ambiguous after exact ID $ownedId. Original: $failure. Rollback: $($_.Exception.Message)" }
              throw "Publication failed; exact Release ID $ownedId was restored to private draft: $failure"
            }
            throw "Release creation was ambiguous; no release was adopted or edited: $failure"
          }
      - name: Remove all exact local publisher copies
        if: always()
        shell: pwsh
        run: |
          $errors = [Collections.Generic.List[string]]::new()
          $runnerTemp = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\')
          foreach ($entry in @(
            [pscustomobject]@{ Path=$env:PUBLISH_LOCAL_ROOT; Pattern='statflow-release-publisher-*' },
            [pscustomobject]@{ Path=$env:PUBLISH_REDOWNLOAD_ROOT; Pattern='statflow-release-redownload-*' }
          )) {
            if (-not $entry.Path -or -not (Test-Path -LiteralPath $entry.Path)) { continue }
            try {
              $root = [IO.Path]::GetFullPath([string]$entry.Path)
              if ([IO.Directory]::GetParent($root).FullName.TrimEnd('\') -cne $runnerTemp -or (Split-Path -Leaf $root) -notlike $entry.Pattern) { throw 'cleanup escaped RUNNER_TEMP' }
              $items = @(Get-Item -LiteralPath $root -Force; Get-ChildItem -LiteralPath $root -Recurse -Force)
              if (@($items | Where-Object { ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 }).Count -gt 0) { throw 'local root contains a reparse point' }
              & icacls.exe $root /inheritance:e /grant:r "$($env:EXPECTED_PUBLISHER_PRINCIPAL):(OI)(CI)(F)" /t /c | Out-Null
              if ($LASTEXITCODE -ne 0) { throw 'could not restore cleanup ACL' }
              Remove-Item -LiteralPath $root -Recurse -Force
              if (Test-Path -LiteralPath $root) { throw 'local state remains' }
            } catch { $errors.Add("$($entry.Path): $($_.Exception.Message)") }
          }
          if ($errors.Count -gt 0) { throw ($errors -join [Environment]::NewLine) }

  cleanup-private-release-handoffs:
    name: Remove exact private build, signed, and verified handoffs
    needs: [build-private-release-candidate, review-private-spss-assertions, sign-release-in-clean-domain, verify-signed-release-in-clean-domain, publish-release]
    if: >-
      always() && needs.build-private-release-candidate.result != 'skipped' &&
      github.repository_id == '1311362169' &&
      vars.TRUSTED_WINDOWS_REPOSITORY_OWNER != '' &&
      github.repository_owner == vars.TRUSTED_WINDOWS_REPOSITORY_OWNER &&
      github.ref == 'refs/heads/main' && github.ref_protected == true
    environment: trusted-windows-release-cleanup
    runs-on:
      group: trusted-windows-release-cleanup
      labels: [self-hosted, Windows, X64, spss-release-cleanup, ephemeral]
    timeout-minutes: 20
    permissions: {}
    env:
      PRIVATE_HANDOFF_ROOT: ${{ secrets.RELEASE_PRIVATE_HANDOFF_ROOT }}
      EXPECTED_CLEANUP_PRINCIPAL: ${{ secrets.RELEASE_CLEANUP_PRINCIPAL }}
      REVIEW_GATE_PRINCIPAL: ${{ secrets.RELEASE_REVIEW_GATE_PRINCIPAL }}
      HANDOFF_OWNER_PRINCIPAL: ${{ secrets.RELEASE_HANDOFF_OWNER_PRINCIPAL }}
      HANDOFF_HARNESS_PATH: ${{ vars.WINDOWS_HANDOFF_HARNESS_PATH }}
      HANDOFF_HARNESS_SHA256: ${{ vars.WINDOWS_HANDOFF_HARNESS_SHA256 }}
      EXPECTED_COMMIT: ${{ github.sha }}
      BUILD_JOB_RESULT: ${{ needs.build-private-release-candidate.result }}
      SIGN_JOB_RESULT: ${{ needs.sign-release-in-clean-domain.result }}
      VERIFICATION_JOB_RESULT: ${{ needs.verify-signed-release-in-clean-domain.result }}
    steps:
      - name: Delete only exact metadata-bound private handoffs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $errors = [Collections.Generic.List[string]]::new()
          if ([Security.Principal.WindowsIdentity]::GetCurrent().Name -cne $env:EXPECTED_CLEANUP_PRINCIPAL -or
              [string]::IsNullOrWhiteSpace($env:REVIEW_GATE_PRINCIPAL) -or [string]::IsNullOrWhiteSpace($env:HANDOFF_OWNER_PRINCIPAL) -or
              $env:REVIEW_GATE_PRINCIPAL -ieq $env:HANDOFF_OWNER_PRINCIPAL -or $env:HANDOFF_HARNESS_SHA256 -cnotmatch '^[0-9a-f]{64}$') {
            throw 'Exact isolated cleanup identity or protected handoff approvals are missing.'
          }
          $handoffHarness = (Resolve-Path -LiteralPath $env:HANDOFF_HARNESS_PATH).Path
          $handoffHarnessItem = Get-Item -LiteralPath $handoffHarness -Force
          $handoffHarnessSignature = Get-AuthenticodeSignature -LiteralPath $handoffHarness
          $handoffHarnessSigner = if ($handoffHarnessSignature.SignerCertificate) { $handoffHarnessSignature.SignerCertificate.GetNameInfo([Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false) } else { '' }
          if ($handoffHarnessItem.PSIsContainer -or ($handoffHarnessItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or
              (Get-FileHash -LiteralPath $handoffHarness -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:HANDOFF_HARNESS_SHA256 -or
              $handoffHarnessSignature.Status -ne 'Valid' -or -not $handoffHarnessSignature.TimeStamperCertificate -or $handoffHarnessSigner -notin @('LAI ZEYU','来泽宇')) {
            throw 'Pinned private-handoff ACL harness is absent, linked, unsigned, or hash-mismatched.'
          }
          $root = [IO.Path]::GetFullPath($env:PRIVATE_HANDOFF_ROOT).TrimEnd('\')
          $rootItem = Get-Item -LiteralPath $root -Force
          if (-not $rootItem.PSIsContainer -or ($rootItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or
              $env:EXPECTED_COMMIT -cnotmatch '^[0-9a-f]{40}$') { throw 'Private cleanup root or commit is invalid.' }
          foreach ($entry in @(
            [pscustomobject]@{ Id="release-build-$($env:EXPECTED_COMMIT)-${{ github.run_id }}-${{ github.run_attempt }}"; Record='handoff.v2.json'; Kind='private-unsigned-release-layout'; Prefix='release-build-'; Schema=2; Required=($env:BUILD_JOB_RESULT -ceq 'success') },
            [pscustomobject]@{ Id="release-signed-$($env:EXPECTED_COMMIT)-${{ github.run_id }}-${{ github.run_attempt }}"; Record='signed.v2.json'; Kind='private-signed-release-verification'; Prefix='release-signed-'; Schema=2; Required=($env:SIGN_JOB_RESULT -ceq 'success') },
            [pscustomobject]@{ Id="release-verified-$($env:EXPECTED_COMMIT)-${{ github.run_id }}-${{ github.run_attempt }}"; Record='publish.v3.json'; Kind='private-verified-release-publication'; Prefix='release-verified-'; Schema=3; Required=($env:VERIFICATION_JOB_RESULT -ceq 'success') }
          )) {
            if ([string]::IsNullOrWhiteSpace($entry.Id)) { continue }
            try {
              $expectedId = "$($entry.Prefix)$($env:EXPECTED_COMMIT)-${{ github.run_id }}-${{ github.run_attempt }}"
              if ($entry.Id -cne $expectedId) { throw 'handoff ID does not belong to this exact workflow run' }
              $target = [IO.Path]::GetFullPath((Join-Path $root $entry.Id))
              if ([IO.Directory]::GetParent($target).FullName.TrimEnd('\') -cne $root) { throw 'target escaped root' }
              if (-not (Test-Path -LiteralPath $target)) {
                if ($entry.Required) { throw 'required private build handoff is missing' }
                continue
              }
              $recordPath = Join-Path $target $entry.Record
              $record = Get-Content -LiteralPath $recordPath -Raw | ConvertFrom-Json
              if ([int]$record.schemaVersion -ne [int]$entry.Schema -or [string]$record.handoffKind -cne $entry.Kind -or
                  [string]$record.handoffId -cne $entry.Id -or [string]$record.repositoryId -cne '1311362169' -or
                  [string]$record.sourceCommit -cne $env:EXPECTED_COMMIT -or [string]$record.workflowRunId -cne '${{ github.run_id }}' -or
                  [int]$record.workflowRunAttempt -ne [int]'${{ github.run_attempt }}') { throw 'ownership record differs' }
              $items = @(Get-Item -LiteralPath $target -Force; Get-ChildItem -LiteralPath $target -Recurse -Force)
              if (@($items | Where-Object { ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 }).Count -gt 0) { throw 'reparse point found' }
              & $handoffHarness delete-handoff `
                --path $target `
                --cleanup $env:EXPECTED_CLEANUP_PRINCIPAL `
                --allowed-owner $env:REVIEW_GATE_PRINCIPAL `
                --allowed-owner $env:HANDOFF_OWNER_PRINCIPAL `
                --forbid-broad `
                --forbid-reparse
              if ($LASTEXITCODE -ne 0) { throw 'least-privilege cleanup harness rejected or failed the exact handoff deletion' }
              if (Test-Path -LiteralPath $target) { throw 'target remains' }
            } catch { $errors.Add("$($entry.Id): $($_.Exception.Message)") }
          }
          if ($errors.Count -gt 0) { throw ($errors -join [Environment]::NewLine) }
