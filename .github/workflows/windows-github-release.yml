name: Trusted Windows GitHub release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing protected tag windows-v1.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: survey-data-workbench-trusted-windows-release
  cancel-in-progress: false

jobs:
  build-private-release-candidate:
    name: Build and test unsigned layout without external upload
    if: >-
      github.repository_id == '1311362169' &&
      vars.TRUSTED_WINDOWS_REPOSITORY_OWNER != '' &&
      github.repository_owner == vars.TRUSTED_WINDOWS_REPOSITORY_OWNER &&
      github.ref == 'refs/heads/main' &&
      github.ref_protected == true &&
      inputs.release_tag == 'windows-v1.1.0'
    environment: trusted-windows-release-build
    runs-on:
      group: trusted-windows-release-build
      labels: [self-hosted, Windows, X64, spss-release-build, ephemeral]
    timeout-minutes: 300
    permissions:
      contents: read
    outputs:
      source_commit: ${{ steps.metadata.outputs.source_commit }}
      handoff_id: ${{ steps.metadata.outputs.handoff_id }}
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      PRIVATE_HANDOFF_ROOT: ${{ secrets.RELEASE_PRIVATE_HANDOFF_ROOT }}
      BUILD_PRINCIPAL: ${{ secrets.RELEASE_BUILD_PRINCIPAL }}
      SIGNING_PRINCIPAL: ${{ secrets.RELEASE_SIGNING_PRINCIPAL }}
      REVIEW_GATE_PRINCIPAL: ${{ secrets.RELEASE_REVIEW_GATE_PRINCIPAL }}
      SPSS_REVIEW_PRINCIPAL_1: ${{ secrets.RELEASE_SPSS_REVIEW_PRINCIPAL_1 }}
      SPSS_REVIEW_PRINCIPAL_2: ${{ secrets.RELEASE_SPSS_REVIEW_PRINCIPAL_2 }}
      CLEANUP_PRINCIPAL: ${{ secrets.RELEASE_CLEANUP_PRINCIPAL }}
      HANDOFF_OWNER_PRINCIPAL: ${{ secrets.RELEASE_HANDOFF_OWNER_PRINCIPAL }}
      HANDOFF_HARNESS_PATH: ${{ vars.WINDOWS_HANDOFF_HARNESS_PATH }}
      HANDOFF_HARNESS_SHA256: ${{ vars.WINDOWS_HANDOFF_HARNESS_SHA256 }}
    steps:
      - name: Check out the selected protected tag without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - name: Resolve exact repository, owner, tag, and current main
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $handoffPrincipals = @(
            $env:BUILD_PRINCIPAL,
            $env:SIGNING_PRINCIPAL,
            $env:REVIEW_GATE_PRINCIPAL,
            $env:SPSS_REVIEW_PRINCIPAL_1,
            $env:SPSS_REVIEW_PRINCIPAL_2,
            $env:CLEANUP_PRINCIPAL,
            $env:HANDOFF_OWNER_PRINCIPAL
          )
          $principalSet = [Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
          $invalidPrincipal = $false
          foreach ($principal in $handoffPrincipals) {
            if ([string]::IsNullOrWhiteSpace($principal) -or $principal -match '[\r\n]' -or -not $principalSet.Add($principal)) {
              $invalidPrincipal = $true
            }
          }
          if ([Security.Principal.WindowsIdentity]::GetCurrent().Name -cne $env:BUILD_PRINCIPAL -or
              $env:RELEASE_TAG -cne 'windows-v1.1.0' -or $env:PRIVATE_HANDOFF_ROOT -notmatch '^\\\\[^\\]+\\[^\\]+' -or
              $invalidPrincipal -or $env:HANDOFF_HARNESS_SHA256 -cnotmatch '^[0-9a-f]{64}$') {
            throw 'Protected private release prerequisites are missing.'
          }
          $handoffHarness = (Resolve-Path -LiteralPath $env:HANDOFF_HARNESS_PATH).Path
          $handoffHarnessItem = Get-Item -LiteralPath $handoffHarness -Force
          $handoffHarnessSignature = Get-AuthenticodeSignature -LiteralPath $handoffHarness
          $handoffHarnessSigner = if ($handoffHarnessSignature.SignerCertificate) { $handoffHarnessSignature.SignerCertificate.GetNameInfo([Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false) } else { '' }
          if ($handoffHarnessItem.PSIsContainer -or ($handoffHarnessItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or
              (Get-FileHash -LiteralPath $handoffHarness -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:HANDOFF_HARNESS_SHA256 -or
              $handoffHarnessSignature.Status -ne 'Valid' -or -not $handoffHarnessSignature.TimeStamperCertificate -or $handoffHarnessSigner -notin @('LAI ZEYU','来泽宇')) {
            throw 'Pinned private-handoff ACL harness is absent, linked, unsigned, or hash-mismatched.'
          }
          $privateRootItem = Get-Item -LiteralPath $env:PRIVATE_HANDOFF_ROOT -Force
          if (-not $privateRootItem.PSIsContainer -or ($privateRootItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
            throw 'Private release root must be one pre-provisioned non-reparse directory.'
          }
          $headers = @{ Accept='application/vnd.github+json'; Authorization="Bearer $env:GH_TOKEN"; 'X-GitHub-Api-Version'='2022-11-28'; 'User-Agent'='statflow-release-builder' }
          $apiBase = "https://api.github.com/repos/$env:GITHUB_REPOSITORY"
          $repo = Invoke-RestMethod -Method Get -Uri $apiBase -Headers $headers -TimeoutSec 120
          if ([string]$repo.id -cne '1311362169' -or [string]$repo.owner.login -cne '${{ github.repository_owner }}' -or [string]$repo.default_branch -cne 'main') {
            throw 'Repository ID, owner, or default branch changed.'
          }
          & git fetch --force origin "refs/tags/$($env:RELEASE_TAG):refs/tags/$($env:RELEASE_TAG)"
          & git fetch --force origin 'refs/heads/main:refs/remotes/origin/main'
          $head = (& git rev-parse HEAD).Trim().ToLowerInvariant()
          $tag = (& git rev-parse "$($env:RELEASE_TAG)^{}").Trim().ToLowerInvariant()
          $main = (& git rev-parse refs/remotes/origin/main).Trim().ToLowerInvariant()
          if ($head -cne $tag -or $head -cne $main -or $head -cne '${{ github.sha }}' -or $head -cnotmatch '^[0-9a-f]{40}$') {
            throw 'Workflow ref, checked-out tag, and exact current main are not one commit.'
          }
          $probe = Invoke-WebRequest -Uri "$apiBase/releases/tags/$env:RELEASE_TAG" -Headers $headers -SkipHttpErrorCheck -TimeoutSec 120
          if ([int]$probe.StatusCode -ne 404) { throw 'Release tag is not provably unused.' }
          "TRUSTED_HANDOFF_HARNESS=$handoffHarness" >> $env:GITHUB_ENV
          "SELECTED_RELEASE_COMMIT=$head" >> $env:GITHUB_ENV
      - name: Set up exact build runtimes
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: 3.12.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.424
      - name: Install exact dependencies
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install 'pip==26.2.1'
          python -m pip install -r requirements-build.txt 'pip-audit==2.10.1'
          python -m pip check
          Push-Location frontend
          try { npm ci } finally { Pop-Location }
      - name: Source gate round 1
        shell: pwsh
        run: |
          python scripts/check_attribution.py
          python -m pip_audit -r requirements.lock.txt
          python -m pip_audit -r requirements-build.txt
          python -m unittest discover -s tests -v
          pwsh -NoProfile -File ./tests/windows_release_policy.tests.ps1
          Push-Location frontend
          try { npm audit; npm run build } finally { Pop-Location }
      - name: Source gate round 2
        shell: pwsh
        run: |
          python scripts/check_attribution.py
          python -m pip check
          python -m pip_audit -r requirements.lock.txt
          python -m pip_audit -r requirements-build.txt
          python -m unittest discover -s tests -v
          pwsh -NoProfile -File ./tests/windows_release_policy.tests.ps1
          Push-Location frontend
          try { npm audit; npm run build } finally { Pop-Location }
      - name: Build and hash the unsigned layout once
        shell: pwsh
        run: |
          ./scripts/Build-Windows.ps1 -Configuration Release -Architecture x64 -SkipTests
          Remove-Item -LiteralPath ./artifacts/windows-x64/pyinstaller -Recurse -Force
          Remove-Item -LiteralPath ./artifacts/windows-x64/pyinstaller-work -Recurse -Force
          ./scripts/Write-ArtifactHashes.ps1 -ArtifactRoot ./artifacts/windows-x64/layout
          ./scripts/Verify-ArtifactHashes.ps1 -ArtifactRoot ./artifacts/windows-x64/layout
          "LAYOUT_MANIFEST_SHA256=$((Get-FileHash ./artifacts/windows-x64/layout/SHA256SUMS.txt -Algorithm SHA256).Hash.ToLowerInvariant())" >> $env:GITHUB_ENV
      - name: Frozen unsigned-layout sidecar round 1
        shell: pwsh
        run: |
          ./scripts/Test-WindowsSidecar.ps1 -LayoutDirectory ./artifacts/windows-x64/layout -DiagnosticsDirectory ./test-results/release-layout-pass-1
          ./scripts/Verify-ArtifactHashes.ps1 -ArtifactRoot ./artifacts/windows-x64/layout
          if ((Get-FileHash ./artifacts/windows-x64/layout/SHA256SUMS.txt -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:LAYOUT_MANIFEST_SHA256) { throw 'Layout round 1 changed bytes.' }
      - name: Frozen unsigned-layout sidecar round 2
        shell: pwsh
        run: |
          ./scripts/Test-WindowsSidecar.ps1 -LayoutDirectory ./artifacts/windows-x64/layout -DiagnosticsDirectory ./test-results/release-layout-pass-2
          ./scripts/Verify-ArtifactHashes.ps1 -ArtifactRoot ./artifacts/windows-x64/layout
          if ((Get-FileHash ./artifacts/windows-x64/layout/SHA256SUMS.txt -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:LAYOUT_MANIFEST_SHA256) { throw 'Layout round 2 did not use identical bytes.' }
      - name: Atomically stage unsigned layout only on private ACL share
        id: metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $handoffId = "release-build-$($env:SELECTED_RELEASE_COMMIT)-$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT)"
          $root = [IO.Path]::GetFullPath($env:PRIVATE_HANDOFF_ROOT).TrimEnd('\')
          $rootItem = Get-Item -LiteralPath $root -Force
          if (-not $rootItem.PSIsContainer -or ($rootItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw 'Private release staging root is invalid.' }
          $final = Join-Path $root $handoffId
          $staging = Join-Path $root ('.staging-' + $handoffId + '-' + [Guid]::NewGuid().ToString('N'))
          if (-not (Test-Path -LiteralPath $root -PathType Container) -or (Test-Path -LiteralPath $final)) { throw 'Private release handoff root is absent or target already exists.' }
          try {
            New-Item -ItemType Directory -Path (Join-Path $staging 'layout') | Out-Null
            Copy-Item -Path ./artifacts/windows-x64/layout/* -Destination (Join-Path $staging 'layout') -Recurse -Force
            ./scripts/Verify-ArtifactHashes.ps1 -ArtifactRoot (Join-Path $staging 'layout')
            if ((Get-FileHash (Join-Path $staging 'layout\SHA256SUMS.txt') -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:LAYOUT_MANIFEST_SHA256) { throw 'Private build handoff differs.' }
            [ordered]@{
              schemaVersion=2; handoffKind='private-unsigned-release-layout'; handoffId=$handoffId
              repository='${{ github.repository }}'; repositoryId=[long]'${{ github.repository_id }}'; repositoryOwner='${{ github.repository_owner }}'
              sourceCommit=$env:SELECTED_RELEASE_COMMIT; releaseTag=$env:RELEASE_TAG; applicationVersion='1.1.0'
              workflowRunId='${{ github.run_id }}'; workflowRunAttempt=[int]'${{ github.run_attempt }}'; layoutManifestSha256=$env:LAYOUT_MANIFEST_SHA256
              handoffHarnessSha256=$env:HANDOFF_HARNESS_SHA256
            } | ConvertTo-Json -Compress | Set-Content -LiteralPath (Join-Path $staging 'handoff.v2.json') -Encoding UTF8
            $items = @(Get-Item -LiteralPath $staging -Force; Get-ChildItem -LiteralPath $staging -Recurse -Force)
            if (@($items | Where-Object { ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 }).Count -gt 0) { throw 'Private release handoff contains a reparse point.' }
            & $env:TRUSTED_HANDOFF_HARNESS publish-handoff `
              --staging-path $staging `
              --final-path $final `
              --owner $env:REVIEW_GATE_PRINCIPAL `
              --writer $env:REVIEW_GATE_PRINCIPAL `
              --reader $env:BUILD_PRINCIPAL `
              --reader $env:SPSS_REVIEW_PRINCIPAL_1 `
              --reader $env:SPSS_REVIEW_PRINCIPAL_2 `
              --cleanup $env:CLEANUP_PRINCIPAL `
              --forbid-principal $env:SIGNING_PRINCIPAL `
              --forbid-broad `
              --forbid-reparse
            if ($LASTEXITCODE -ne 0) { throw 'Could not atomically publish and freeze the build-to-review handoff.' }
            & $env:TRUSTED_HANDOFF_HARNESS assert-handoff `
              --path $final `
              --owner $env:REVIEW_GATE_PRINCIPAL `
              --writer $env:REVIEW_GATE_PRINCIPAL `
              --reader $env:BUILD_PRINCIPAL `
              --reader $env:SPSS_REVIEW_PRINCIPAL_1 `
              --reader $env:SPSS_REVIEW_PRINCIPAL_2 `
              --cleanup $env:CLEANUP_PRINCIPAL `
              --forbid-principal $env:SIGNING_PRINCIPAL `
              --forbid-broad `
              --forbid-reparse
            if ($LASTEXITCODE -ne 0) { throw 'Atomic build-to-review ownership transfer did not persist after rename.' }
          } finally {
            if (Test-Path -LiteralPath $staging) {
              if ([IO.Directory]::GetParent([IO.Path]::GetFullPath($staging)).FullName.TrimEnd('\') -cne $root -or
                  (Split-Path -Leaf $staging) -cnotmatch "^\.staging-$([Regex]::Escape($handoffId))-[0-9a-f]{32}$") { throw 'Release-build staging cleanup escaped its exact root.' }
              $stagingItems = @(Get-Item -LiteralPath $staging -Force; Get-ChildItem -LiteralPath $staging -Recurse -Force)
              if (@($stagingItems | Where-Object { ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 }).Count -gt 0) { throw 'Release-build staging residue contains a reparse point.' }
              & icacls.exe $staging /inheritance:r /grant:r "$($env:BUILD_PRINCIPAL):(OI)(CI)(F)" /t /c | Out-Null
              if ($LASTEXITCODE -ne 0) { throw 'Could not establish release-build staging cleanup ACL.' }
              Remove-Item -LiteralPath $staging -Recurse -Force
              if (Test-Path -LiteralPath $staging) { throw 'Release-build staging residue remains.' }
            }
          }
          "source_commit=$($env:SELECTED_RELEASE_COMMIT)" >> $env:GITHUB_OUTPUT
          "handoff_id=$handoffId" >> $env:GITHUB_OUTPUT
          @(
            '## Private licensed-SPSS review handoff is ready'
            ''
            "- Handoff ID: ``$handoffId``"
            "- Candidate manifest SHA-256: ``$($env:LAYOUT_MANIFEST_SHA256)``"
            '- The protected SPSS review job must remain unapproved until two authorised environments have tested these exact private bytes and the reviewer has updated the private assertion secrets.'
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding UTF8
          Write-Host 'Unsigned layout remained on the private ACL share; no GitHub artifact was created.'

  review-private-spss-assertions:
    name: Reviewer-approved assertions for the exact staged private layout
    needs: build-private-release-candidate
    if: >-
      needs.build-private-release-candidate.result == 'success' &&
      github.repository_id == '1311362169' &&
      vars.TRUSTED_WINDOWS_REPOSITORY_OWNER != '' &&
      github.repository_owner == vars.TRUSTED_WINDOWS_REPOSITORY_OWNER &&
      github.ref == 'refs/heads/main' && github.ref_protected == true
    environment: trusted-windows-release-spss-review
    runs-on:
      group: trusted-windows-release-review
      labels: [self-hosted, Windows, X64, spss-release-review, ephemeral]
    timeout-minutes: 240
    permissions:
      contents: read
    outputs:
      approved_layout_digest: ${{ steps.assertions.outputs.approved_layout_digest }}
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      SOURCE_COMMIT: ${{ needs.build-private-release-candidate.outputs.source_commit }}
      BUILD_HANDOFF_ID: ${{ needs.build-private-release-candidate.outputs.handoff_id }}
      PRIVATE_HANDOFF_ROOT: ${{ secrets.RELEASE_PRIVATE_HANDOFF_ROOT }}
      BUILD_PRINCIPAL: ${{ secrets.RELEASE_BUILD_PRINCIPAL }}
      SIGNING_PRINCIPAL: ${{ secrets.RELEASE_SIGNING_PRINCIPAL }}
      EXPECTED_REVIEW_PRINCIPAL: ${{ secrets.RELEASE_REVIEW_GATE_PRINCIPAL }}
      SPSS_REVIEW_PRINCIPAL_1: ${{ secrets.RELEASE_SPSS_REVIEW_PRINCIPAL_1 }}
      SPSS_REVIEW_PRINCIPAL_2: ${{ secrets.RELEASE_SPSS_REVIEW_PRINCIPAL_2 }}
      CLEANUP_PRINCIPAL: ${{ secrets.RELEASE_CLEANUP_PRINCIPAL }}
      HANDOFF_OWNER_PRINCIPAL: ${{ secrets.RELEASE_HANDOFF_OWNER_PRINCIPAL }}
      HANDOFF_HARNESS_PATH: ${{ vars.WINDOWS_HANDOFF_HARNESS_PATH }}
      HANDOFF_HARNESS_SHA256: ${{ vars.WINDOWS_HANDOFF_HARNESS_SHA256 }}
    steps:
      - name: Check out the exact staged source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.build-private-release-candidate.outputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false
          clean: true
      - name: Set up the exact assertion verifier runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: 3.12.10
      - name: Re-prove repository, tag, and exact current main at review time
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $headers = @{ Accept='application/vnd.github+json'; Authorization="Bearer $env:GH_TOKEN"; 'X-GitHub-Api-Version'='2022-11-28'; 'User-Agent'='statflow-spss-review-gate' }
          $repository = Invoke-RestMethod -Method Get -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY" -Headers $headers -TimeoutSec 120
          if ([string]$repository.id -cne '1311362169' -or [string]$repository.owner.login -cne '${{ github.repository_owner }}' -or
              [string]$repository.default_branch -cne 'main') { throw 'Repository identity changed before licensed-SPSS review.' }
          & git fetch --force origin 'refs/heads/main:refs/remotes/origin/main'
          & git fetch --force origin "refs/tags/$($env:RELEASE_TAG):refs/tags/$($env:RELEASE_TAG)"
          $head = (& git rev-parse HEAD).Trim().ToLowerInvariant()
          $main = (& git rev-parse refs/remotes/origin/main).Trim().ToLowerInvariant()
          $tag = (& git rev-parse "$($env:RELEASE_TAG)^{}").Trim().ToLowerInvariant()
          if ($head -cne $env:SOURCE_COMMIT -or $head -cne $main -or $head -cne $tag -or $head -cnotmatch '^[0-9a-f]{40}$') {
            throw 'Licensed-SPSS review is not bound to the exact current main and protected tag commit.'
          }
      - name: Verify two private assertions against the exact staged candidate
        id: assertions
        shell: pwsh
        env:
          RELEASE_APPROVED: ${{ vars.SPSS_RELEASE_VALIDATION_APPROVED }}
          VALIDATED_TAG: ${{ vars.SPSS_RELEASE_VALIDATED_TAG }}
          SPSS_ASSERTION_1_JSON: ${{ secrets.SPSS_ASSERTION_1_JSON }}
          SPSS_ASSERTION_1_HMAC_SHA256: ${{ secrets.SPSS_ASSERTION_1_HMAC_SHA256 }}
          SPSS_ASSERTION_2_JSON: ${{ secrets.SPSS_ASSERTION_2_JSON }}
          SPSS_ASSERTION_2_HMAC_SHA256: ${{ secrets.SPSS_ASSERTION_2_HMAC_SHA256 }}
          SPSS_ASSERTION_HMAC_KEY_BASE64: ${{ secrets.SPSS_ASSERTION_HMAC_KEY_BASE64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_APPROVED -cne 'true' -or $env:VALIDATED_TAG -cne $env:RELEASE_TAG) {
            throw 'Protected reviewers have not approved two assertions for this exact tag.'
          }
          if ([Security.Principal.WindowsIdentity]::GetCurrent().Name -cne $env:EXPECTED_REVIEW_PRINCIPAL) {
            throw 'Licensed-SPSS review must run under the exact isolated review-gate principal.'
          }
          $principals = @($env:BUILD_PRINCIPAL,$env:SIGNING_PRINCIPAL,$env:EXPECTED_REVIEW_PRINCIPAL,$env:SPSS_REVIEW_PRINCIPAL_1,$env:SPSS_REVIEW_PRINCIPAL_2,$env:CLEANUP_PRINCIPAL,$env:HANDOFF_OWNER_PRINCIPAL)
          $principalSet = [Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
          foreach ($principal in $principals) {
            if ([string]::IsNullOrWhiteSpace($principal) -or $principal -match '[\r\n]' -or -not $principalSet.Add($principal)) {
              throw 'Private licensed-SPSS handoff principals are missing, malformed, or reused.'
            }
          }
          if ($env:HANDOFF_HARNESS_SHA256 -cnotmatch '^[0-9a-f]{64}$') { throw 'Protected handoff harness digest is missing.' }
          $handoffHarness = (Resolve-Path -LiteralPath $env:HANDOFF_HARNESS_PATH).Path
          $handoffHarnessItem = Get-Item -LiteralPath $handoffHarness -Force
          $handoffHarnessSignature = Get-AuthenticodeSignature -LiteralPath $handoffHarness
          $handoffHarnessSigner = if ($handoffHarnessSignature.SignerCertificate) { $handoffHarnessSignature.SignerCertificate.GetNameInfo([Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false) } else { '' }
          if ($handoffHarnessItem.PSIsContainer -or ($handoffHarnessItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or
              (Get-FileHash -LiteralPath $handoffHarness -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:HANDOFF_HARNESS_SHA256 -or
              $handoffHarnessSignature.Status -ne 'Valid' -or -not $handoffHarnessSignature.TimeStamperCertificate -or $handoffHarnessSigner -notin @('LAI ZEYU','来泽宇')) {
            throw 'Pinned private-handoff ACL harness is absent, linked, unsigned, or hash-mismatched.'
          }
          $root = [IO.Path]::GetFullPath($env:PRIVATE_HANDOFF_ROOT).TrimEnd('\')
          $rootItem = Get-Item -LiteralPath $root -Force
          if (-not $rootItem.PSIsContainer -or ($rootItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
            throw 'Private licensed-SPSS handoff root is absent or linked.'
          }
          if ($env:BUILD_HANDOFF_ID -cne "release-build-$($env:SOURCE_COMMIT)-${{ github.run_id }}-${{ github.run_attempt }}") {
            throw 'Private licensed-SPSS handoff does not belong to this exact workflow run.'
          }
          $handoff = [IO.Path]::GetFullPath((Join-Path $root $env:BUILD_HANDOFF_ID))
          if ([IO.Directory]::GetParent($handoff).FullName.TrimEnd('\') -cne $root) { throw 'Private licensed-SPSS handoff escaped its root.' }
          $items = @(Get-Item -LiteralPath $handoff -Force; Get-ChildItem -LiteralPath $handoff -Recurse -Force)
          if (@($items | Where-Object { ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 }).Count -gt 0) {
            throw 'Private licensed-SPSS handoff contains a reparse point.'
          }
          & $handoffHarness assert-handoff `
            --path $handoff `
            --owner $env:EXPECTED_REVIEW_PRINCIPAL `
            --writer $env:EXPECTED_REVIEW_PRINCIPAL `
            --reader $env:BUILD_PRINCIPAL `
            --reader $env:SPSS_REVIEW_PRINCIPAL_1 `
            --reader $env:SPSS_REVIEW_PRINCIPAL_2 `
            --cleanup $env:CLEANUP_PRINCIPAL `
            --forbid-principal $env:SIGNING_PRINCIPAL `
            --forbid-broad `
            --forbid-reparse
          if ($LASTEXITCODE -ne 0) { throw 'Build-to-review ACL or owner is not the exact expected pre-approval state.' }
          $record = Get-Content -LiteralPath (Join-Path $handoff 'handoff.v2.json') -Raw | ConvertFrom-Json
          $recordProperties = @('applicationVersion','handoffHarnessSha256','handoffId','handoffKind','layoutManifestSha256','releaseTag','repository','repositoryId','repositoryOwner','schemaVersion','sourceCommit','workflowRunAttempt','workflowRunId') | Sort-Object
          if ((Compare-Object $recordProperties (@($record.PSObject.Properties.Name) | Sort-Object)) -or
              [int]$record.schemaVersion -ne 2 -or [string]$record.handoffKind -cne 'private-unsigned-release-layout' -or
              [string]$record.handoffId -cne $env:BUILD_HANDOFF_ID -or [string]$record.repository -cne '${{ github.repository }}' -or
              [string]$record.repositoryId -cne '1311362169' -or [string]$record.repositoryOwner -cne '${{ github.repository_owner }}' -or
              [string]$record.sourceCommit -cne $env:SOURCE_COMMIT -or [string]$record.releaseTag -cne $env:RELEASE_TAG -or
              [string]$record.applicationVersion -cne '1.1.0' -or [string]$record.workflowRunId -cne '${{ github.run_id }}' -or
              [int]$record.workflowRunAttempt -ne [int]'${{ github.run_attempt }}' -or
              [string]$record.layoutManifestSha256 -cnotmatch '^[0-9a-f]{64}$' -or
              [string]$record.handoffHarnessSha256 -cne $env:HANDOFF_HARNESS_SHA256) { throw 'Private licensed-SPSS handoff metadata differs.' }
          $layout = Join-Path $handoff 'layout'
          ./scripts/Verify-ArtifactHashes.ps1 -ArtifactRoot $layout
          $actualDigest = (Get-FileHash -LiteralPath (Join-Path $layout 'SHA256SUMS.txt') -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualDigest -cne [string]$record.layoutManifestSha256) { throw 'Private licensed-SPSS candidate differs from its frozen handoff record.' }
          $assertedDigest = (& python ./scripts/verify_spss_release_attestations.py --repo . --tag $env:RELEASE_TAG --commit $env:SOURCE_COMMIT --app-version 1.1.0 --print-candidate-sha256-only).Trim()
          if ($LASTEXITCODE -ne 0 -or $assertedDigest -cnotmatch '^[0-9a-f]{64}$' -or $assertedDigest -cne $actualDigest) {
            throw 'Reviewer-approved private SPSS assertions do not name the exact staged candidate bytes.'
          }
          & $handoffHarness transition-handoff `
            --path $handoff `
            --owner $env:HANDOFF_OWNER_PRINCIPAL `
            --reader $env:BUILD_PRINCIPAL `
            --reader $env:EXPECTED_REVIEW_PRINCIPAL `
            --reader $env:SPSS_REVIEW_PRINCIPAL_1 `
            --reader $env:SPSS_REVIEW_PRINCIPAL_2 `
            --reader $env:SIGNING_PRINCIPAL `
            --cleanup $env:CLEANUP_PRINCIPAL `
            --forbid-writer `
            --forbid-broad `
            --forbid-reparse
          if ($LASTEXITCODE -ne 0) { throw 'Review-to-signing ACL/owner transfer failed.' }
          & $handoffHarness assert-handoff `
            --path $handoff `
            --owner $env:HANDOFF_OWNER_PRINCIPAL `
            --reader $env:BUILD_PRINCIPAL `
            --reader $env:EXPECTED_REVIEW_PRINCIPAL `
            --reader $env:SPSS_REVIEW_PRINCIPAL_1 `
            --reader $env:SPSS_REVIEW_PRINCIPAL_2 `
            --reader $env:SIGNING_PRINCIPAL `
            --cleanup $env:CLEANUP_PRINCIPAL `
            --forbid-writer `
            --forbid-broad `
            --forbid-reparse
          if ($LASTEXITCODE -ne 0) { throw 'Review-to-signing handoff retained a previous writer.' }
          ./scripts/Verify-ArtifactHashes.ps1 -ArtifactRoot $layout
          $postTransferDigest = (Get-FileHash -LiteralPath (Join-Path $layout 'SHA256SUMS.txt') -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($postTransferDigest -cne $actualDigest) { throw 'Candidate bytes changed during the atomic review-to-signing transfer.' }
          "approved_layout_digest=$actualDigest" >> $env:GITHUB_OUTPUT
          Write-Host 'Two reviewer-approved private assertions match the exact staged private layout; shared HMAC remains integrity-only.'

  sign-release-in-clean-domain:
    name: Clean no-checkout sign-only domain with complete credential cleanup
    needs: [build-private-release-candidate, review-private-spss-assertions]
    if: >-
      needs.build-private-release-candidate.result == 'success' &&
      needs.review-private-spss-assertions.result == 'success' &&
      github.repository_id == '1311362169' &&
      vars.TRUSTED_WINDOWS_REPOSITORY_OWNER != '' &&
      github.repository_owner == vars.TRUSTED_WINDOWS_REPOSITORY_OWNER &&
      github.ref == 'refs/heads/main' && github.ref_protected == true
    environment: trusted-windows-release-signing
    runs-on:
      group: trusted-windows-release-signing
      labels: [self-hosted, Windows, X64, spss-release-signing, ephemeral]
    timeout-minutes: 240
    permissions: {}
    outputs:
      signed_handoff_id: ${{ steps.signed.outputs.signed_handoff_id }}
      installer_name: ${{ steps.signed.outputs.installer_name }}
      installer_sha256: ${{ steps.signed.outputs.installer_sha256 }}
      signer_thumbprint: ${{ steps.signed.outputs.signer_thumbprint }}
      signing_evidence_sha256: ${{ steps.signed.outputs.signing_evidence_sha256 }}
      pe_inventory_sha256: ${{ steps.signed.outputs.pe_inventory_sha256 }}
      signing_harness_sha256: ${{ steps.signed.outputs.signing_harness_sha256 }}
    env:
      SOURCE_COMMIT: ${{ needs.build-private-release-candidate.outputs.source_commit }}
      BUILD_HANDOFF_ID: ${{ needs.build-private-release-candidate.outputs.handoff_id }}
      PRIVATE_HANDOFF_ROOT: ${{ secrets.RELEASE_PRIVATE_HANDOFF_ROOT }}
      EXPECTED_SIGNING_PRINCIPAL: ${{ secrets.RELEASE_SIGNING_PRINCIPAL }}
      BUILD_PRINCIPAL: ${{ secrets.RELEASE_BUILD_PRINCIPAL }}
      REVIEW_GATE_PRINCIPAL: ${{ secrets.RELEASE_REVIEW_GATE_PRINCIPAL }}
      SPSS_REVIEW_PRINCIPAL_1: ${{ secrets.RELEASE_SPSS_REVIEW_PRINCIPAL_1 }}
      SPSS_REVIEW_PRINCIPAL_2: ${{ secrets.RELEASE_SPSS_REVIEW_PRINCIPAL_2 }}
      VERIFIER_PRINCIPAL: ${{ secrets.RELEASE_VERIFIER_PRINCIPAL }}
      PUBLISHER_PRINCIPAL: ${{ secrets.RELEASE_PUBLISHER_PRINCIPAL }}
      CLEANUP_PRINCIPAL: ${{ secrets.RELEASE_CLEANUP_PRINCIPAL }}
      HANDOFF_OWNER_PRINCIPAL: ${{ secrets.RELEASE_HANDOFF_OWNER_PRINCIPAL }}
      SIGNING_HARNESS_PATH: ${{ vars.WINDOWS_SIGNING_HARNESS_PATH }}
      SIGNING_HARNESS_SHA256: ${{ vars.WINDOWS_SIGNING_HARNESS_SHA256 }}
      HANDOFF_HARNESS_PATH: ${{ vars.WINDOWS_HANDOFF_HARNESS_PATH }}
      HANDOFF_HARNESS_SHA256: ${{ vars.WINDOWS_HANDOFF_HARNESS_SHA256 }}
      EXPECTED_SIGNER_THUMBPRINT: ${{ vars.WINDOWS_SIGNER_THUMBPRINT }}
      SPSS_APPROVED_LAYOUT_DIGEST: ${{ needs.review-private-spss-assertions.outputs.approved_layout_digest }}
    steps:
      - name: Verify clean signing domain and exact private input
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($forbidden in @('SSL_ESIGNER_USERNAME','SSL_ESIGNER_PASSWORD','SSL_ESIGNER_TOTP_SECRET')) {
            if (-not [string]::IsNullOrEmpty([Environment]::GetEnvironmentVariable($forbidden))) { throw "$forbidden must never enter the workflow signing process." }
          }
          $principals = @($env:EXPECTED_SIGNING_PRINCIPAL,$env:BUILD_PRINCIPAL,$env:REVIEW_GATE_PRINCIPAL,$env:SPSS_REVIEW_PRINCIPAL_1,$env:SPSS_REVIEW_PRINCIPAL_2,$env:VERIFIER_PRINCIPAL,$env:PUBLISHER_PRINCIPAL,$env:CLEANUP_PRINCIPAL,$env:HANDOFF_OWNER_PRINCIPAL)
          $principalSet = [Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
          foreach ($principal in $principals) {
            if ([string]::IsNullOrWhiteSpace($principal) -or $principal -match '[\r\n]' -or -not $principalSet.Add($principal)) { throw 'Protected release principals are missing, malformed, or reused.' }
          }
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent().Name
          if ($identity -cne $env:EXPECTED_SIGNING_PRINCIPAL -or $env:SOURCE_COMMIT -cnotmatch '^[0-9a-f]{40}$' -or
              $env:SIGNING_HARNESS_SHA256 -cnotmatch '^[0-9a-f]{64}$' -or $env:HANDOFF_HARNESS_SHA256 -cnotmatch '^[0-9a-f]{64}$' -or
              $env:EXPECTED_SIGNER_THUMBPRINT -cnotmatch '^[0-9A-Fa-f]{40,64}$') {
            throw 'Clean signing identity or pinned harness inputs are missing.'
          }
          $handoffHarness = (Resolve-Path -LiteralPath $env:HANDOFF_HARNESS_PATH).Path
          $handoffHarnessItem = Get-Item -LiteralPath $handoffHarness -Force
          $handoffHarnessSignature = Get-AuthenticodeSignature -LiteralPath $handoffHarness
          $handoffHarnessSigner = if ($handoffHarnessSignature.SignerCertificate) { $handoffHarnessSignature.SignerCertificate.GetNameInfo([Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false) } else { '' }
          if ($handoffHarnessItem.PSIsContainer -or ($handoffHarnessItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or
              (Get-FileHash -LiteralPath $handoffHarness -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:HANDOFF_HARNESS_SHA256 -or
              $handoffHarnessSignature.Status -ne 'Valid' -or -not $handoffHarnessSignature.TimeStamperCertificate -or $handoffHarnessSigner -notin @('LAI ZEYU','来泽宇')) {
            throw 'Pinned private-handoff ACL harness is absent, linked, unsigned, or hash-mismatched.'
          }
          $harness = (Resolve-Path -LiteralPath $env:SIGNING_HARNESS_PATH).Path
          $harnessItem = Get-Item -LiteralPath $harness -Force
          $harnessSignature = Get-AuthenticodeSignature -LiteralPath $harness
          $harnessSigner = if ($harnessSignature.SignerCertificate) { $harnessSignature.SignerCertificate.GetNameInfo([Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false) } else { '' }
          if ($harnessItem.PSIsContainer -or ($harnessItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or
              (Get-FileHash -LiteralPath $harness -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:SIGNING_HARNESS_SHA256 -or
              $harnessSignature.Status -ne 'Valid' -or -not $harnessSignature.TimeStamperCertificate -or $harnessSigner -notin @('LAI ZEYU','来泽宇')) {
            throw 'Pre-provisioned signing harness is absent, linked, or hash-mismatched.'
          }
          $root = [IO.Path]::GetFullPath($env:PRIVATE_HANDOFF_ROOT).TrimEnd('\')
          $rootItem = Get-Item -LiteralPath $root -Force
          if (-not $rootItem.PSIsContainer -or ($rootItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw 'Private signing handoff root is invalid.' }
          $source = [IO.Path]::GetFullPath((Join-Path $root $env:BUILD_HANDOFF_ID))
          if ([IO.Directory]::GetParent($source).FullName.TrimEnd('\') -cne $root) { throw 'Private build handoff escaped its root.' }
          if ($env:BUILD_HANDOFF_ID -cnotmatch "^release-build-$([Regex]::Escape($env:SOURCE_COMMIT))-(\d+)-(\d+)$") { throw 'Private build handoff ID is malformed.' }
          $buildWorkflowRunId = $Matches[1]
          $buildWorkflowRunAttempt = [int]$Matches[2]
          $record = Get-Content -LiteralPath (Join-Path $source 'handoff.v2.json') -Raw | ConvertFrom-Json
          $buildRecordProperties = @('applicationVersion','handoffHarnessSha256','handoffId','handoffKind','layoutManifestSha256','releaseTag','repository','repositoryId','repositoryOwner','schemaVersion','sourceCommit','workflowRunAttempt','workflowRunId') | Sort-Object
          if ((Compare-Object $buildRecordProperties (@($record.PSObject.Properties.Name) | Sort-Object)) -or
              [int]$record.schemaVersion -ne 2 -or [string]$record.handoffKind -cne 'private-unsigned-release-layout' -or
              [string]$record.handoffId -cne $env:BUILD_HANDOFF_ID -or [string]$record.repositoryId -cne '1311362169' -or
              [string]$record.repository -cne '${{ github.repository }}' -or [string]$record.repositoryOwner -cne '${{ github.repository_owner }}' -or
              [string]$record.sourceCommit -cne $env:SOURCE_COMMIT -or [string]$record.releaseTag -cne 'windows-v1.1.0' -or
              [string]$record.applicationVersion -cne '1.1.0' -or [string]$record.workflowRunId -cne $buildWorkflowRunId -or
              [int]$record.workflowRunAttempt -ne $buildWorkflowRunAttempt -or
              [string]$record.layoutManifestSha256 -cnotmatch '^[0-9a-f]{64}$' -or
              [string]$record.layoutManifestSha256 -cne $env:SPSS_APPROVED_LAYOUT_DIGEST -or
              [string]$record.handoffHarnessSha256 -cne $env:HANDOFF_HARNESS_SHA256) { throw 'Private build handoff metadata differs from the exact reviewer-approved candidate.' }
          $privateItems = @(Get-Item -LiteralPath $source -Force; Get-ChildItem -LiteralPath $source -Recurse -Force)
          if (@($privateItems | Where-Object { ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 }).Count -gt 0) { throw 'Private build handoff contains a reparse point.' }
          & $handoffHarness assert-handoff `
            --path $source `
            --owner $env:HANDOFF_OWNER_PRINCIPAL `
            --reader $env:BUILD_PRINCIPAL `
            --reader $env:REVIEW_GATE_PRINCIPAL `
            --reader $env:SPSS_REVIEW_PRINCIPAL_1 `
            --reader $env:SPSS_REVIEW_PRINCIPAL_2 `
            --reader $env:EXPECTED_SIGNING_PRINCIPAL `
            --cleanup $env:CLEANUP_PRINCIPAL `
            --forbid-writer `
            --forbid-principal $env:VERIFIER_PRINCIPAL `
            --forbid-broad `
            --forbid-reparse
          if ($LASTEXITCODE -ne 0) { throw 'Review-to-signing handoff retained a writer or has a different owner/ACL.' }
          $localRoot = Join-Path $env:RUNNER_TEMP "statflow-clean-signing-${{ github.run_id }}-${{ github.run_attempt }}"
          $runnerTemp = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\')
          if ([IO.Directory]::GetParent([IO.Path]::GetFullPath($localRoot)).FullName.TrimEnd('\') -cne $runnerTemp -or
              (Test-Path -LiteralPath $localRoot)) { throw 'Signing runner is not one fresh direct RUNNER_TEMP child.' }
          # Record the deterministic cleanup boundary before any local input or
          # output is created so a partially failed copy cannot become residue.
          "CLEAN_SIGNING_ROOT=$localRoot" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Path (Join-Path $localRoot 'input') | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $localRoot 'output') | Out-Null
          Copy-Item -Path (Join-Path $source 'layout\*') -Destination (Join-Path $localRoot 'input') -Recurse -Force
          $inputRoot = Join-Path $localRoot 'input'
          $localItems = @(Get-Item -LiteralPath $inputRoot -Force; Get-ChildItem -LiteralPath $inputRoot -Recurse -Force)
          if (@($localItems | Where-Object { ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 }).Count -gt 0) { throw 'Local signing input contains a reparse point.' }
          $manifestPath = Join-Path $inputRoot 'SHA256SUMS.txt'
          $localDigest = (Get-FileHash $manifestPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($localDigest -cne [string]$record.layoutManifestSha256) { throw 'Local signing input differs from private handoff.' }
          $manifestPaths = [Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
          foreach ($line in Get-Content -LiteralPath $manifestPath -Encoding UTF8) {
            if ($line -cnotmatch '^([0-9a-f]{64})  (.+)$') { throw 'Local signing manifest is malformed.' }
            $relative = $Matches[2]
            if ([IO.Path]::IsPathRooted($relative) -or $relative -match '[\r\n]' -or $relative.Replace('\','/').Split('/') -contains '..' -or -not $manifestPaths.Add($relative.Replace('\','/'))) { throw 'Local signing manifest path is unsafe or duplicated.' }
            $target = [IO.Path]::GetFullPath((Join-Path $inputRoot $relative))
            if (-not $target.StartsWith($inputRoot.TrimEnd('\') + '\', [StringComparison]::OrdinalIgnoreCase) -or
                -not (Test-Path -LiteralPath $target -PathType Leaf) -or
                (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant() -cne $Matches[1]) { throw 'Local signing manifest content differs.' }
          }
          $actualPaths = @(Get-ChildItem -LiteralPath $inputRoot -File -Recurse | Where-Object { $_.FullName -cne $manifestPath } | ForEach-Object { [IO.Path]::GetRelativePath($inputRoot,$_.FullName).Replace('\','/') })
          if ($actualPaths.Count -ne $manifestPaths.Count -or (Compare-Object @($manifestPaths | Sort-Object) @($actualPaths | Sort-Object))) { throw 'Local signing inventory differs from its manifest.' }
          & icacls.exe $inputRoot /inheritance:r /grant:r "$($env:EXPECTED_SIGNING_PRINCIPAL):(OI)(CI)(RX)" /t /c | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Could not freeze local signing input read-only.' }
          "TRUSTED_SIGNING_HARNESS=$harness" >> $env:GITHUB_ENV
          "TRUSTED_HANDOFF_HARNESS=$handoffHarness" >> $env:GITHUB_ENV
          "EXPECTED_LAYOUT_DIGEST=$localDigest" >> $env:GITHUB_ENV
      - name: Invoke only the pinned out-of-repository signing harness
        id: signed
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:TRUSTED_SIGNING_HARNESS `
            sign-only-release `
            --input-layout (Join-Path $env:CLEAN_SIGNING_ROOT 'input') `
            --output-directory (Join-Path $env:CLEAN_SIGNING_ROOT 'output') `
            --application-version '1.1.0' `
            --expected-layout-manifest-sha256 $env:EXPECTED_LAYOUT_DIGEST `
            --expected-signer-thumbprint $env:EXPECTED_SIGNER_THUMBPRINT `
            --forbid-candidate-execution
          if ($LASTEXITCODE -ne 0) { throw 'Pinned signing harness failed.' }
          $output = Join-Path $env:CLEAN_SIGNING_ROOT 'output'
          $installerName = 'Survey-Data-Workbench-by-LAI-ZEYU-1.1.0-x64-setup.exe'
          $installer = Join-Path $output $installerName
          $hashFile = Join-Path $output 'SHA256SUMS.txt'
          $evidencePath = Join-Path $output 'signing-evidence.v1.json'
          $inventoryPath = Join-Path $output 'portable-executable-inventory.v1.json'
          $outputItems = @(Get-Item -LiteralPath $output -Force; Get-ChildItem -LiteralPath $output -Recurse -Force)
          if (@($outputItems | Where-Object { ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 }).Count -gt 0) { throw 'Signing harness output contains a reparse point.' }
          $files = @(Get-ChildItem -LiteralPath $output -File -Force)
          if ($files.Count -ne 4 -or -not (Test-Path -LiteralPath $installer -PathType Leaf) -or
              -not (Test-Path -LiteralPath $hashFile -PathType Leaf) -or -not (Test-Path -LiteralPath $evidencePath -PathType Leaf) -or
              -not (Test-Path -LiteralPath $inventoryPath -PathType Leaf)) { throw 'Signing harness output inventory differs.' }
          $installerItem = Get-Item -LiteralPath $installer -Force
          $hashItem = Get-Item -LiteralPath $hashFile -Force
          $evidenceItem = Get-Item -LiteralPath $evidencePath -Force
          $inventoryItem = Get-Item -LiteralPath $inventoryPath -Force
          if ($installerItem.Length -lt 1MB -or $installerItem.Length -gt 2GB -or
              $hashItem.Length -lt 70 -or $hashItem.Length -gt 512 -or
              $evidenceItem.Length -lt 512 -or $evidenceItem.Length -gt 64KB -or
              $inventoryItem.Length -lt 512 -or $inventoryItem.Length -gt 20MB) {
            throw 'Signing harness output file sizes are outside their exact safe bounds.'
          }
          $installerHash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ((Get-Content -LiteralPath $hashFile -Raw).Trim() -cne "$installerHash  $installerName") { throw 'Signed checksum file differs.' }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          $simpleName = $signature.SignerCertificate.GetNameInfo([Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false)
          if ($signature.Status -ne 'Valid' -or -not $signature.TimeStamperCertificate -or
              $signature.SignerCertificate.Thumbprint -ine $env:EXPECTED_SIGNER_THUMBPRINT -or $simpleName -notin @('LAI ZEYU','来泽宇')) { throw 'Final installer lacks exact trusted LAI signature.' }
          $evidence = Get-Content -LiteralPath $evidencePath -Raw | ConvertFrom-Json
          $evidenceProperties = @('allPortableExecutablesHaveExactlyOneSignature','allPortableExecutablesSigned','candidateExecutionPerformedInSigningDomain','installerSha256','inventoryMatchesAllDiscoveredPortableExecutables','keyStorageProviderKind','layoutManifestSha256','longLivedTotpSeedExposedToCommandLine','pfxOrExportedPrivateKeyUsed','portableExecutableCount','portableExecutableInventorySha256','privateKeyContainersRemoved','provider','providerBaselineRestored','recursiveMzPeHeaderScanCompleted','rfc3161TimestampVerified','schemaVersion','signerThumbprint','signingCredentialCleanupVerified','timestampAuthorityEkuVerified','windowsSignToolUsed') | Sort-Object
          if ((Compare-Object $evidenceProperties (@($evidence.PSObject.Properties.Name) | Sort-Object)) -or
              [int]$evidence.schemaVersion -ne 1 -or [string]$evidence.provider -cne 'SSL.com eSigner CKA 1.1.2' -or
              [string]$evidence.installerSha256 -cne $installerHash -or [string]$evidence.layoutManifestSha256 -cne $env:EXPECTED_LAYOUT_DIGEST -or
              [string]$evidence.signerThumbprint -ine $env:EXPECTED_SIGNER_THUMBPRINT -or $evidence.allPortableExecutablesSigned -ne $true -or
              $evidence.recursiveMzPeHeaderScanCompleted -ne $true -or $evidence.inventoryMatchesAllDiscoveredPortableExecutables -ne $true -or
              $evidence.allPortableExecutablesHaveExactlyOneSignature -ne $true -or $evidence.windowsSignToolUsed -ne $true -or
              [string]$evidence.keyStorageProviderKind -cne 'CNG-KSP' -or $evidence.pfxOrExportedPrivateKeyUsed -ne $false -or
              [int]$evidence.portableExecutableCount -lt 3 -or [string]$evidence.portableExecutableInventorySha256 -cnotmatch '^[0-9a-f]{64}$' -or
              $evidence.rfc3161TimestampVerified -ne $true -or $evidence.timestampAuthorityEkuVerified -ne $true -or
              $evidence.candidateExecutionPerformedInSigningDomain -ne $false -or $evidence.signingCredentialCleanupVerified -ne $true -or
              $evidence.providerBaselineRestored -ne $true -or $evidence.privateKeyContainersRemoved -ne $true -or
              $evidence.longLivedTotpSeedExposedToCommandLine -ne $false) { throw 'Pinned signing harness evidence is incomplete.' }
          $inventoryHash = (Get-FileHash -LiteralPath $inventoryPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($inventoryHash -cne [string]$evidence.portableExecutableInventorySha256) { throw 'Recursive PE inventory file does not match signing evidence.' }
          $inventory = Get-Content -LiteralPath $inventoryPath -Raw | ConvertFrom-Json
          $inventoryProperties = @('entries','installerSha256','inventoryKind','layoutManifestSha256','schemaVersion','signerThumbprint') | Sort-Object
          if ((Compare-Object $inventoryProperties (@($inventory.PSObject.Properties.Name) | Sort-Object)) -or
              [int]$inventory.schemaVersion -ne 1 -or [string]$inventory.inventoryKind -cne 'recursive-final-signed-pe-inventory' -or
              [string]$inventory.layoutManifestSha256 -cne $env:EXPECTED_LAYOUT_DIGEST -or [string]$inventory.installerSha256 -cne $installerHash -or
              [string]$inventory.signerThumbprint -ine $env:EXPECTED_SIGNER_THUMBPRINT -or @($inventory.entries).Count -ne [int]$evidence.portableExecutableCount) { throw 'Recursive PE inventory metadata differs.' }
          $inventoryPaths = [Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
          foreach ($entry in @($inventory.entries)) {
            $entryProperties = @('fileSha256','relativePath','rfc3161TimestampVerified','signatureCount','signerThumbprint','timestampAuthorityEkuVerified') | Sort-Object
            $relative = [string]$entry.relativePath
            if ((Compare-Object $entryProperties (@($entry.PSObject.Properties.Name) | Sort-Object)) -or
                [string]::IsNullOrWhiteSpace($relative) -or $relative.Length -gt 512 -or $relative -match '[\x00-\x1f]' -or [IO.Path]::IsPathRooted($relative) -or
                $relative.Replace('\','/').Split('/') -contains '..' -or -not $inventoryPaths.Add($relative.Replace('\','/')) -or
                [string]$entry.fileSha256 -cnotmatch '^[0-9a-f]{64}$' -or [string]$entry.signerThumbprint -ine $env:EXPECTED_SIGNER_THUMBPRINT -or
                [int]$entry.signatureCount -ne 1 -or $entry.rfc3161TimestampVerified -ne $true -or $entry.timestampAuthorityEkuVerified -ne $true) {
              throw 'Recursive PE inventory contains an unsafe, duplicate, or incompletely verified entry.'
            }
          }
          if (-not $inventoryPaths.Contains($installerName)) { throw 'Recursive PE inventory omits the final installer.' }
          $installerInventoryEntries = @($inventory.entries | Where-Object { [string]$_.relativePath -ceq $installerName })
          if ($installerInventoryEntries.Count -ne 1 -or [string]$installerInventoryEntries[0].fileSha256 -cne $installerHash) {
            throw 'Recursive PE inventory does not bind the final installer entry to its exact bytes.'
          }
          $signedHandoffId = "release-signed-$($env:SOURCE_COMMIT)-$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT)"
          $root = [IO.Path]::GetFullPath($env:PRIVATE_HANDOFF_ROOT).TrimEnd('\')
          $rootItem = Get-Item -LiteralPath $root -Force
          if (-not $rootItem.PSIsContainer -or ($rootItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw 'Private signed-verification root is invalid.' }
          $final = Join-Path $root $signedHandoffId
          $staging = Join-Path $root ('.staging-' + $signedHandoffId + '-' + [Guid]::NewGuid().ToString('N'))
          if (Test-Path -LiteralPath $final) { throw 'Signed private verification handoff already exists.' }
          try {
            New-Item -ItemType Directory -Path $staging | Out-Null
            Copy-Item -LiteralPath $installer,$hashFile,$evidencePath,$inventoryPath -Destination $staging
            $evidenceHash = (Get-FileHash -LiteralPath (Join-Path $staging 'signing-evidence.v1.json') -Algorithm SHA256).Hash.ToLowerInvariant()
            [ordered]@{
              schemaVersion=2; handoffKind='private-signed-release-verification'; handoffId=$signedHandoffId
              repository='${{ github.repository }}'; repositoryId=[long]'${{ github.repository_id }}'; repositoryOwner='${{ github.repository_owner }}'
              sourceCommit=$env:SOURCE_COMMIT; releaseTag='windows-v1.1.0'; applicationVersion='1.1.0'
              workflowRunId='${{ github.run_id }}'; workflowRunAttempt=[int]'${{ github.run_attempt }}'; buildHandoffId=$env:BUILD_HANDOFF_ID
              installerName=$installerName; installerSha256=$installerHash; signerThumbprint=$env:EXPECTED_SIGNER_THUMBPRINT.ToLowerInvariant()
              signingEvidenceSha256=$evidenceHash; signingHarnessSha256=$env:SIGNING_HARNESS_SHA256
              portableExecutableInventorySha256=$inventoryHash; handoffHarnessSha256=$env:HANDOFF_HARNESS_SHA256
            } | ConvertTo-Json -Compress | Set-Content -LiteralPath (Join-Path $staging 'signed.v2.json') -Encoding UTF8
            $stagingItems = @(Get-Item -LiteralPath $staging -Force; Get-ChildItem -LiteralPath $staging -Recurse -Force)
            if (@($stagingItems | Where-Object { ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 }).Count -gt 0) { throw 'Signed verification staging contains a reparse point.' }
            & $env:TRUSTED_HANDOFF_HARNESS publish-handoff `
              --staging-path $staging `
              --final-path $final `
              --owner $env:HANDOFF_OWNER_PRINCIPAL `
              --reader $env:EXPECTED_SIGNING_PRINCIPAL `
              --reader $env:VERIFIER_PRINCIPAL `
              --cleanup $env:CLEANUP_PRINCIPAL `
              --forbid-writer `
              --forbid-principal $env:BUILD_PRINCIPAL `
              --forbid-principal $env:REVIEW_GATE_PRINCIPAL `
              --forbid-principal $env:PUBLISHER_PRINCIPAL `
              --forbid-broad `
              --forbid-reparse
            if ($LASTEXITCODE -ne 0) { throw 'Could not atomically publish the frozen sign-to-verifier handoff after credential cleanup.' }
            & $env:TRUSTED_HANDOFF_HARNESS assert-handoff `
              --path $final `
              --owner $env:HANDOFF_OWNER_PRINCIPAL `
              --reader $env:EXPECTED_SIGNING_PRINCIPAL `
              --reader $env:VERIFIER_PRINCIPAL `
              --cleanup $env:CLEANUP_PRINCIPAL `
              --forbid-writer `
              --forbid-principal $env:BUILD_PRINCIPAL `
              --forbid-principal $env:REVIEW_GATE_PRINCIPAL `
              --forbid-principal $env:PUBLISHER_PRINCIPAL `
              --forbid-broad `
              --forbid-reparse
            if ($LASTEXITCODE -ne 0) { throw 'Sign-to-verifier handoff retained signer write access or changed after rename.' }
            if ((Get-FileHash -LiteralPath (Join-Path $final $installerName) -Algorithm SHA256).Hash.ToLowerInvariant() -cne $installerHash) { throw 'Signed installer changed during immutable handoff transfer.' }
          } finally {
            if (Test-Path -LiteralPath $staging) {
              if ([IO.Directory]::GetParent([IO.Path]::GetFullPath($staging)).FullName.TrimEnd('\') -cne $root -or
                  (Split-Path -Leaf $staging) -cnotmatch "^\.staging-$([Regex]::Escape($signedHandoffId))-[0-9a-f]{32}$") { throw 'Signed-handoff staging cleanup escaped its exact root.' }
              $stagingItems = @(Get-Item -LiteralPath $staging -Force; Get-ChildItem -LiteralPath $staging -Recurse -Force)
              if (@($stagingItems | Where-Object { ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 }).Count -gt 0) { throw 'Signed-handoff staging residue contains a reparse point.' }
              & icacls.exe $staging /inheritance:r /grant:r "$($env:EXPECTED_SIGNING_PRINCIPAL):(OI)(CI)(F)" /t /c | Out-Null
              if ($LASTEXITCODE -ne 0) { throw 'Could not establish signed-handoff staging cleanup ACL.' }
              Remove-Item -LiteralPath $staging -Recurse -Force
              if (Test-Path -LiteralPath $staging) { throw 'Signed-handoff staging residue remains.' }
            }
          }
          "signed_handoff_id=$signedHandoffId" >> $env:GITHUB_OUTPUT
          "installer_name=$installerName" >> $env:GITHUB_OUTPUT
          "installer_sha256=$installerHash" >> $env:GITHUB_OUTPUT
          "signer_thumbprint=$($env:EXPECTED_SIGNER_THUMBPRINT.ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "signing_evidence_sha256=$evidenceHash" >> $env:GITHUB_OUTPUT
          "pe_inventory_sha256=$inventoryHash" >> $env:GITHUB_OUTPUT
          "signing_harness_sha256=$($env:SIGNING_HARNESS_SHA256)" >> $env:GITHUB_OUTPUT
      - name: Remove local signing inputs and outputs
        if: always()
        shell: pwsh
        run: |
          if ($env:CLEAN_SIGNING_ROOT -and (Test-Path -LiteralPath $env:CLEAN_SIGNING_ROOT)) {
            $root = [IO.Path]::GetFullPath($env:CLEAN_SIGNING_ROOT)
            $runnerTemp = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\')
            if ([IO.Directory]::GetParent($root).FullName.TrimEnd('\') -cne $runnerTemp -or (Split-Path -Leaf $root) -notlike 'statflow-clean-signing-*') { throw 'Signing cleanup escaped RUNNER_TEMP.' }
            $items = @(Get-Item -LiteralPath $root -Force; Get-ChildItem -LiteralPath $root -Recurse -Force)
            if (@($items | Where-Object { ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 }).Count -gt 0) { throw 'Signing root contains a reparse point.' }
            Remove-Item -LiteralPath $root -Recurse -Force
            if (Test-Path -LiteralPath $root) { throw 'Local signing state remains.' }
          }

  verify-signed-release-in-clean-domain:
    name: Independent no-signing lifecycle verifier for exact signed bytes
    needs: [build-private-release-candidate, sign-release-in-clean-domain]
    if: >-
      needs.sign-release-in-clean-domain.result == 'success' &&
      github.repository_id == '1311362169' &&
      vars.TRUSTED_WINDOWS_REPOSITORY_OWNER != '' &&
      github.repository_owner == vars.TRUSTED_WINDOWS_REPOSITORY_OWNER &&
      github.ref == 'refs/heads/main' && github.ref_protected == true
    environment: trusted-windows-release-verification
    runs-on:
      group: trusted-windows-release-verifier
      labels: [self-hosted, Windows, X64, spss-release-verifier, ephemeral]
    timeout-minutes: 180
    permissions: {}
    outputs:
      verified_handoff_id: ${{ steps.verified.outputs.verified_handoff_id }}
      installer_name: ${{ steps.verified.outputs.installer_name }}
      installer_sha256: ${{ steps.verified.outputs.installer_sha256 }}
      signer_thumbprint: ${{ steps.verified.outputs.signer_thumbprint }}
      signing_evidence_sha256: ${{ steps.verified.outputs.signing_evidence_sha256 }}
      pe_inventory_sha256: ${{ steps.verified.outputs.pe_inventory_sha256 }}
      signing_harness_sha256: ${{ steps.verified.outputs.signing_harness_sha256 }}
      verification_evidence_sha256: ${{ steps.verified.outputs.verification_evidence_sha256 }}
      verification_harness_sha256: ${{ steps.verified.outputs.verification_harness_sha256 }}
    env:
      SOURCE_COMMIT: ${{ needs.build-private-release-candidate.outputs.source_commit }}
      BUILD_HANDOFF_ID: ${{ needs.build-private-release-candidate.outputs.handoff_id }}
      SIGNED_HANDOFF_ID: ${{ needs.sign-release-in-clean-domain.outputs.signed_handoff_id }}
      EXPECTED_INSTALLER_NAME: ${{ needs.sign-release-in-clean-domain.outputs.installer_name }}
      EXPECTED_INSTALLER_SHA256: ${{ needs.sign-release-in-clean-domain.outputs.installer_sha256 }}
      EXPECTED_SIGNER_THUMBPRINT: ${{ needs.sign-release-in-clean-domain.outputs.signer_thumbprint }}
      EXPECTED_SIGNING_EVIDENCE_SHA256: ${{ needs.sign-release-in-clean-domain.outputs.signing_evidence_sha256 }}
      EXPECTED_PE_INVENTORY_SHA256: ${{ needs.sign-release-in-clean-domain.outputs.pe_inventory_sha256 }}
      EXPECTED_SIGNING_HARNESS_SHA256: ${{ needs.sign-release-in-clean-domain.outputs.signing_harness_sha256 }}
      PRIVATE_HANDOFF_ROOT: ${{ secrets.RELEASE_PRIVATE_HANDOFF_ROOT }}
      EXPECTED_VERIFIER_PRINCIPAL: ${{ secrets.RELEASE_VERIFIER_PRINCIPAL }}
      SIGNING_PRINCIPAL: ${{ secrets.RELEASE_SIGNING_PRINCIPAL }}
      BUILD_PRINCIPAL: ${{ secrets.RELEASE_BUILD_PRINCIPAL }}
      REVIEW_GATE_PRINCIPAL: ${{ secrets.RELEASE_REVIEW_GATE_PRINCIPAL }}
      PUBLISHER_PRINCIPAL: ${{ secrets.RELEASE_PUBLISHER_PRINCIPAL }}
      CLEANUP_PRINCIPAL: ${{ secrets.RELEASE_CLEANUP_PRINCIPAL }}
      HANDOFF_OWNER_PRINCIPAL: ${{ secrets.RELEASE_HANDOFF_OWNER_PRINCIPAL }}
      VERIFICATION_HARNESS_PATH: ${{ vars.WINDOWS_VERIFICATION_HARNESS_PATH }}
      VERIFICATION_HARNESS_SHA256: ${{ vars.WINDOWS_VERIFICATION_HARNESS_SHA256 }}
      HANDOFF_HARNESS_PATH: ${{ vars.WINDOWS_HANDOFF_HARNESS_PATH }}
      HANDOFF_HARNESS_SHA256: ${{ vars.WINDOWS_HANDOFF_HARNESS_SHA256 }}
      APPROVED_SIGNER_THUMBPRINT: ${{ vars.WINDOWS_SIGNER_THUMBPRINT }}
    steps:
      - name: Admit exact signed handoff into an account without signing authority
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent().Name
          $principals = @($env:EXPECTED_VERIFIER_PRINCIPAL,$env:SIGNING_PRINCIPAL,$env:BUILD_PRINCIPAL,$env:REVIEW_GATE_PRINCIPAL,$env:PUBLISHER_PRINCIPAL,$env:CLEANUP_PRINCIPAL,$env:HANDOFF_OWNER_PRINCIPAL)
          $principalSet = [Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
          foreach ($principal in $principals) {
            if ([string]::IsNullOrWhiteSpace($principal) -or $principal -match '[\r\n]' -or -not $principalSet.Add($principal)) {
              throw 'Release domain principals are missing, malformed, or reused.'
            }
          }
          if ($identity -cne $env:EXPECTED_VERIFIER_PRINCIPAL -or $env:SOURCE_COMMIT -cnotmatch '^[0-9a-f]{40}$' -or
              $env:EXPECTED_INSTALLER_SHA256 -cnotmatch '^[0-9a-f]{64}$' -or $env:EXPECTED_SIGNER_THUMBPRINT -cnotmatch '^[0-9a-f]{40,64}$' -or
              $env:EXPECTED_SIGNER_THUMBPRINT -cne $env:APPROVED_SIGNER_THUMBPRINT.ToLowerInvariant() -or
              $env:VERIFICATION_HARNESS_SHA256 -cnotmatch '^[0-9a-f]{64}$' -or $env:HANDOFF_HARNESS_SHA256 -cnotmatch '^[0-9a-f]{64}$') {
            throw 'Independent verifier identity or protected approvals are missing.'
          }
          foreach ($forbidden in @('SSL_ESIGNER_USERNAME','SSL_ESIGNER_PASSWORD','SSL_ESIGNER_TOTP_SECRET','ESIGNER_CKA_PIN','ESIGNER_CKA_SECRET','PFX_PASSWORD')) {
            if (-not [string]::IsNullOrEmpty([Environment]::GetEnvironmentVariable($forbidden))) {
              throw "$forbidden must never enter the independent verifier process."
            }
          }
          $privateSignerKeys = @(
            Get-ChildItem Cert:\CurrentUser\My -ErrorAction Stop
            Get-ChildItem Cert:\LocalMachine\My -ErrorAction Stop
          ) | Where-Object { $_.Thumbprint -ieq $env:EXPECTED_SIGNER_THUMBPRINT -and $_.HasPrivateKey }
          if (@($privateSignerKeys).Count -ne 0) { throw 'Verifier account or machine exposes the release signing private key.' }
          $handoffHarness = (Resolve-Path -LiteralPath $env:HANDOFF_HARNESS_PATH).Path
          $handoffHarnessItem = Get-Item -LiteralPath $handoffHarness -Force
          $handoffHarnessSignature = Get-AuthenticodeSignature -LiteralPath $handoffHarness
          $handoffHarnessSigner = if ($handoffHarnessSignature.SignerCertificate) { $handoffHarnessSignature.SignerCertificate.GetNameInfo([Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false) } else { '' }
          if ($handoffHarnessItem.PSIsContainer -or ($handoffHarnessItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or
              (Get-FileHash -LiteralPath $handoffHarness -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:HANDOFF_HARNESS_SHA256 -or
              $handoffHarnessSignature.Status -ne 'Valid' -or -not $handoffHarnessSignature.TimeStamperCertificate -or $handoffHarnessSigner -notin @('LAI ZEYU','来泽宇')) {
            throw 'Pinned private-handoff ACL harness is absent, linked, unsigned, or hash-mismatched.'
          }
          $harness = (Resolve-Path -LiteralPath $env:VERIFICATION_HARNESS_PATH).Path
          $harnessItem = Get-Item -LiteralPath $harness -Force
          $harnessParent = Get-Item -LiteralPath $harnessItem.Directory.FullName -Force
          $harnessSignature = Get-AuthenticodeSignature -LiteralPath $harness
          $harnessSigner = if ($harnessSignature.SignerCertificate) { $harnessSignature.SignerCertificate.GetNameInfo([Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false) } else { '' }
          if ($harnessItem.PSIsContainer -or ($harnessItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or
              ($harnessParent.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or
              (Get-FileHash -LiteralPath $harness -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:VERIFICATION_HARNESS_SHA256 -or
              $harnessSignature.Status -ne 'Valid' -or -not $harnessSignature.TimeStamperCertificate -or $harnessSigner -notin @('LAI ZEYU','来泽宇')) {
            throw 'Pre-provisioned independent verification harness is absent, linked, unsigned, or hash-mismatched.'
          }
          $root = [IO.Path]::GetFullPath($env:PRIVATE_HANDOFF_ROOT).TrimEnd('\')
          $rootItem = Get-Item -LiteralPath $root -Force
          if (-not $rootItem.PSIsContainer -or ($rootItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) { throw 'Private verifier handoff root is invalid.' }
          if ($env:SIGNED_HANDOFF_ID -cne "release-signed-$($env:SOURCE_COMMIT)-${{ github.run_id }}-${{ github.run_attempt }}") {
            throw 'Signed handoff does not belong to this exact workflow run.'
          }
          $source = [IO.Path]::GetFullPath((Join-Path $root $env:SIGNED_HANDOFF_ID))
          if ([IO.Directory]::GetParent($source).FullName.TrimEnd('\') -cne $root -or -not (Test-Path -LiteralPath $source -PathType Container)) {
            throw 'Signed handoff escaped or is absent from the private root.'
          }
          $sourceItems = @(Get-Item -LiteralPath $source -Force; Get-ChildItem -LiteralPath $source -Recurse -Force)
          if (@($sourceItems | Where-Object { ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 }).Count -gt 0) { throw 'Signed handoff contains a reparse point.' }
          & $handoffHarness assert-handoff `
            --path $source `
            --owner $env:HANDOFF_OWNER_PRINCIPAL `
            --reader $env:SIGNING_PRINCIPAL `
            --reader $env:EXPECTED_VERIFIER_PRINCIPAL `
            --cleanup $env:CLEANUP_PRINCIPAL `
            --forbid-writer `
            --forbid-principal $env:BUILD_PRINCIPAL `
            --forbid-principal $env:REVIEW_GATE_PRINCIPAL `
            --forbid-principal $env:PUBLISHER_PRINCIPAL `
            --forbid-broad `
            --forbid-reparse
          if ($LASTEXITCODE -ne 0) { throw 'Sign-to-verifier handoff retained a writer or has a different owner/ACL.' }
          $recordPath = Join-Path $source 'signed.v2.json'
          $record = Get-Content -LiteralPath $recordPath -Raw | ConvertFrom-Json
          $recordProperties = @('applicationVersion','buildHandoffId','handoffHarnessSha256','handoffId','handoffKind','installerName','installerSha256','portableExecutableInventorySha256','releaseTag','repository','repositoryId','repositoryOwner','schemaVersion','signerThumbprint','signingEvidenceSha256','signingHarnessSha256','sourceCommit','workflowRunAttempt','workflowRunId') | Sort-Object
          $installer = Join-Path $source $env:EXPECTED_INSTALLER_NAME
          $hashFile = Join-Path $source 'SHA256SUMS.txt'
          $signingEvidence = Join-Path $source 'signing-evidence.v1.json'
          $inventory = Join-Path $source 'portable-executable-inventory.v1.json'
          if (@(Get-ChildItem -LiteralPath $source -File -Force).Count -ne 5 -or
              (Compare-Object $recordProperties (@($record.PSObject.Properties.Name) | Sort-Object)) -or
              [int]$record.schemaVersion -ne 2 -or [string]$record.handoffKind -cne 'private-signed-release-verification' -or
              [string]$record.handoffId -cne $env:SIGNED_HANDOFF_ID -or [string]$record.repository -cne '${{ github.repository }}' -or
              [string]$record.repositoryId -cne '1311362169' -or [string]$record.repositoryOwner -cne '${{ github.repository_owner }}' -or
              [string]$record.sourceCommit -cne $env:SOURCE_COMMIT -or [string]$record.releaseTag -cne 'windows-v1.1.0' -or
              [string]$record.applicationVersion -cne '1.1.0' -or [string]$record.workflowRunId -cne '${{ github.run_id }}' -or
              [int]$record.workflowRunAttempt -ne [int]'${{ github.run_attempt }}' -or [string]$record.buildHandoffId -cne $env:BUILD_HANDOFF_ID -or
              [string]$record.installerName -cne $env:EXPECTED_INSTALLER_NAME -or [string]$record.installerSha256 -cne $env:EXPECTED_INSTALLER_SHA256 -or
              [string]$record.signerThumbprint -cne $env:EXPECTED_SIGNER_THUMBPRINT -or
              [string]$record.signingEvidenceSha256 -cne $env:EXPECTED_SIGNING_EVIDENCE_SHA256 -or
              [string]$record.portableExecutableInventorySha256 -cne $env:EXPECTED_PE_INVENTORY_SHA256 -or
              [string]$record.signingHarnessSha256 -cne $env:EXPECTED_SIGNING_HARNESS_SHA256 -or
              [string]$record.handoffHarnessSha256 -cne $env:HANDOFF_HARNESS_SHA256 -or
              (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:EXPECTED_INSTALLER_SHA256 -or
              (Get-Content -LiteralPath $hashFile -Raw).Trim() -cne "$($env:EXPECTED_INSTALLER_SHA256)  $($env:EXPECTED_INSTALLER_NAME)" -or
              (Get-FileHash -LiteralPath $signingEvidence -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:EXPECTED_SIGNING_EVIDENCE_SHA256 -or
              (Get-FileHash -LiteralPath $inventory -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:EXPECTED_PE_INVENTORY_SHA256) {
            throw 'Signed handoff metadata or bytes differ from the sign-only domain outputs.'
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          $simpleName = $signature.SignerCertificate.GetNameInfo([Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false)
          if ($signature.Status -ne 'Valid' -or -not $signature.TimeStamperCertificate -or
              $signature.SignerCertificate.Thumbprint.ToLowerInvariant() -cne $env:EXPECTED_SIGNER_THUMBPRINT -or $simpleName -notin @('LAI ZEYU','来泽宇')) {
            throw 'Verifier input lacks the exact trusted LAI signature and timestamp.'
          }
          $localRoot = Join-Path $env:RUNNER_TEMP "statflow-clean-verification-${{ github.run_id }}-${{ github.run_attempt }}"
          $runnerTemp = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\')
          if ([IO.Directory]::GetParent([IO.Path]::GetFullPath($localRoot)).FullName.TrimEnd('\') -cne $runnerTemp -or (Test-Path -LiteralPath $localRoot)) {
            throw 'Verifier local root is not one fresh direct RUNNER_TEMP child.'
          }
          "CLEAN_VERIFICATION_ROOT=$localRoot" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Path (Join-Path $localRoot 'input') | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $localRoot 'evidence') | Out-Null
          Copy-Item -LiteralPath $installer,$hashFile,$signingEvidence,$inventory,$recordPath -Destination (Join-Path $localRoot 'input')
          $localInstaller = Join-Path $localRoot "input\$($env:EXPECTED_INSTALLER_NAME)"
          if ((Get-FileHash -LiteralPath $localInstaller -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:EXPECTED_INSTALLER_SHA256) {
